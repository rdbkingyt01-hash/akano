let L='en';try{L=localStorage.getItem('l')||'en'}catch(e){}

let U=null,APPS={},$=s=>document.querySelector(s);

const ic={h:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>',u:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/></svg>'};
const setAv=()=>{$('#av').textContent=U?[...(U.displayName||U.email||'A')][0].toUpperCase():'A'};
$('#lg').onclick=()=>{L=L==='bn'?'en':'bn';try{localStorage.setItem('l',L)}catch(e){}route()};

function route(){
  const h=location.hash||'#/',p=h.split('/');$('#lg').textContent=L==='bn'?'EN':'বাং';

  m.innerHTML=`<h2>${t('acc')}</h2><div id="nw" style="display:none"><label>${t('name')}</label><input id="nm"></div><label>${t('email')}</label><input id="e" type="email" placeholder="example@gmail.com"><label>${t('pass')}</label><input id="p" type="password"><button class="btn" id="go">${t('login')}</button><p style="text-align:center;margin-top:14px"><a href="#" id="tg" style="color:#000;font-weight:600">${t('noacc')}</a></p>`;
  let up=false;const go=p=>p.catch(e=>toast(e.message));
  $('#tg').onclick=e=>{e.preventDefault();up=!up;$('#nw').style.display=up?'block':'none';$('#go').textContent=up?t('su'):t('login');$('#tg').textContent=up?t('has'):t('noacc')};
  $('#go').onclick=()=>{const em=$('#e').value.trim(),pw=$('#p').value;
    if(!up)return go(auth.signInWithEmailAndPassword(em,pw));
    const nm=$('#nm').value.trim();if(!nm)return toast(t('nn'));
    const lp=em.toLowerCase().split('@')[0];if(!/^[^@\s]+@gmail\.com$/i.test(em)||lp.includes('+'))return toast(t('gonly'));
    if(ADMINS.includes(em.toLowerCase()))return toast(t('used'));
    let arr=[];try{arr=JSON.parse(localStorage.getItem('su')||'[]').filter(x=>Date.now()-x<864e5)}catch(e){}
    if(arr.length>=2)return toast(t('lim'));
    go((async()=>{const c=await auth.createUserWithEmailAndPassword(em,pw);
      try{await db.collection('emails').doc(lp.replace(/\./g,'')+'@gmail.com').set({uid:c.user.uid})}catch(e){await c.user.delete();throw new Error(t('used'))}
      await c.user.updateProfile({displayName:nm});
      try{arr.push(Date.now());localStorage.setItem('su',JSON.stringify(arr))}catch(e){}
      setAv();route()})())};
}

/* ---------- ADMIN ---------- */
function small(f,max,png){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL(png?'image/png':'image/jpeg',0.75))};i.onerror=()=>no(new Error('Cannot read this image'));i.src=u})}
async function img(file,max,png){try{const f=new FormData();f.append('image',file);const r=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB,{method:'POST',body:f}),j=await r.json();if(!j.success)throw 0;return j.data.url}catch(e){return await small(file,max,png)}}
const to=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Timed out: Firestore database not created, rules not published, or no internet')),ms))]);
let editId=null;
function adminLogin(){$('#m').innerHTML=`<h2>${t('alogin')}</h2><label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap2" type="password"><button class="btn" id="ag">${t('login')}</button>`;
  $('#ag').onclick=async()=>{try{const c=await auth.signInWithEmailAndPassword($('#ae').value.trim(),$('#ap2').value);
    if(!ADMINS.includes((c.user.email||'').toLowerCase())){await auth.signOut();toast(t('anot'))}}catch(e){toast(e.message)}}}
function adminList(){const e=$('#al2');if(e)e.innerHTML=list().map(x=>`<div class="row"><img src="${E(x.icon)}"><div style="flex:1"><b>${E(x.name)}</b><br><small>${fmt(x.size)} · ${x.downloads||0} downloads · v${E(x.ver||'1.0.0')}</small></div><button class="btn o sm" onclick="editId='${x.id}';admin();scrollTo(0,0)">Edit</button><button class="btn o sm" onclick="del('${x.id}')">Delete</button></div>`).join('')}
function admin(){
  const l=list(),a=editId?APPS[editId]:{};
  $('#m').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${editId?'Edit':'Upload'} app</h2><button class="btn o sm" onclick="auth.signOut()">Logout</button></div>
  <label>App name</label><input id="n" value="${E(a.name)}"><label>Developer</label><input id="d" value="${E(a.dev||'Frangowst')}">
  <label>Categories (comma)</label><input id="c" value="${E(a.cats)}" placeholder="Entertainment, Streaming, Animation">
  <label>Version (e.g. 1.0.0)</label><input id="vr" value="${E(a.ver||'1.0.0')}"><label>What's new</label><textarea id="wn" rows="2">${E(a.wn)}</textarea>
  <label>Description</label><textarea id="ds" rows="3">${E(a.desc)}</textarea>
  <label><input type="checkbox" id="ad" style="width:auto" ${a.ads!==false?'checked':''}> Contains ad</label><br><br>
  <label>App icon ${editId?'(optional)':''}</label><input type="file" id="ic" accept="image/*">
  <label>Screenshots</label><input type="file" id="sh" accept="image/*" multiple>
  <label>GitHub repo (username/repo) — auto-fills APK link, size &amp; version from the latest Release</label><input id="gh" value="${E(a.gh)}" placeholder="username/repo">
  <label>APK file (only to read its size — NOT uploaded)</label><input type="file" id="ap" accept=".apk">
  <label>or APK direct download link</label><input id="al" value="${E(a.apk)}" placeholder="https://..."><label>Size in MB (only if you did not select the file)</label><input id="sz" type="number" step="0.1">
  <button class="btn" id="sv">${editId?'Save changes':'Publish'}</button><p id="er" style="color:#c00;font-weight:600;margin-top:10px"></p>${editId?'<button class="btn o" onclick="editId=null;admin()">Cancel</button>':''}
  <h2>All apps</h2><div id="al2"></div>`;adminList();
  $('#sv').onclick=async()=>{const b=$('#sv');b.disabled=true;b.textContent='Wait…';
    try{const o={name:$('#n').value.trim(),dev:$('#d').value.trim(),cats:$('#c').value,desc:$('#ds').value,ads:$('#ad').checked,ver:$('#vr').value.trim()||'1.0.0',wn:$('#wn').value,updatedAt:Date.now()};
      if(!o.name)throw new Error('Name required');
      const ic=$('#ic').files[0],shs=[...$('#sh').files],ap=$('#ap').files[0];
      pr('1/3 Uploading images…','#555');if(ic)o.icon=await img(ic,192,true);else if(!a.icon)throw new Error('Icon required — select an app icon');
      if(shs.length)o.shots=await Promise.all(shs.slice(0,6).map(f=>img(f,800,false)));
      pr('2/3 Checking APK / GitHub…','#555');const gm=$('#gh').value.trim().match(/^(?:https?:\/\/github\.com\/)?([\w.-]+\/[\w.-]+)/);
      if(gm){o.gh=gm[1];const r=await fetch('https://api.github.com/repos/'+o.gh+'/releases/latest');
        if(!r.ok)throw new Error('GitHub Release not found (repo must be Public and a Release must be published)');
        const j=await r.json(),as=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
        if(!as)throw new Error('No .apk file in the latest Release');
        o.apk=as.browser_download_url;o.size=as.size;o.ver=(j.tag_name||'').replace(/^v/i,'')||o.ver;
        if(!$('#wn').value.trim()&&j.body)o.wn=j.body.slice(0,500)}
      else{o.gh='';o.apk=$('#al').value.trim().replace(/^https?:\/\/github\.com\/([^\/]+\/[^\/]+)\/blob\//,'https://raw.githubusercontent.com/$1/');
        if(!/^https?:\/\//.test(o.apk))throw new Error('GitHub repo or APK link required');
        if(ap)o.size=ap.size;else if($('#sz').value)o.size=Math.round($('#sz').value*1048576)}
      pr('3/3 Saving to database…','#555');await to(editId?db.collection('apps').doc(editId).update(o):db.collection('apps').add({...o,downloads:0,createdAt:Date.now()}),20000);
      toast('Done ✓');editId=null;admin();pr('Published ✓','#080')}
    catch(e){const m=e.code==='permission-denied'?'Permission denied: publish the Firestore rules and log in as admin':e.message;pr(m);toast(m);b.disabled=false;b.textContent=editId?'Save changes':'Publish'}}
}
async function del(id){if(confirm('Delete this app?'))await db.collection('apps').doc(id).delete()}
</script></body></html>
