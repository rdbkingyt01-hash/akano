ধাপ ১ - Firebase Console:
  Authentication > Sign-in method > Email/Password চালু করুন।
  Firestore Database তৈরি করুন (production mode)।
ধাপ ২ - Firestore > Rules এ এটি বসান:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&exists(/databases/$(d)/documents/admins/$(request.auth.uid));}
 match /site/{x}{allow read:if true;allow write:if adm();}
 match /comics/{x}{allow read:if true;allow create,delete:if adm();allow update:if adm()||(request.resource.data.diff(resource.data).affectedKeys().hasOnly(['views'])&&request.resource.data.views is int&&request.resource.data.views==resource.data.get('views',0)+1);}
 match /pages/{x}{allow read:if true;allow write:if adm();}
 match /gallery/{x}{allow read:if true;allow write:if adm();}
 match /news/{x}{allow read:if true;allow write:if adm();}
 match /orders/{x}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','method','trx','comicId','comic','price','t'])&&request.resource.data.name is string&&request.resource.data.name.size()<200;allow read,update,delete:if adm();}
 match /codes/{c}{allow get:if true;allow list,create,delete:if adm();
  allow update:if adm()||(!('device' in resource.data)&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&request.resource.data.device is string&&request.resource.data.device.size()<80);}
 match /reviews/{x}{allow read:if resource.data.approved==true||adm();allow create:if request.resource.data.keys().hasOnly(['name','rating','text','comic','approved','t'])&&request.resource.data.approved==false&&request.resource.data.rating is int&&request.resource.data.rating>=1&&request.resource.data.rating<=5&&request.resource.data.name is string&&request.resource.data.name.size()>0&&request.resource.data.name.size()<=60&&request.resource.data.text is string&&request.resource.data.text.size()>0&&request.resource.data.text.size()<=500&&request.resource.data.comic is string&&request.resource.data.comic.size()<=120;allow update,delete:if adm();}
 match /videoViews/{x}{allow read:if true;allow create:if request.resource.data.keys().hasOnly(['n'])&&request.resource.data.n==1;allow update:if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['n'])&&request.resource.data.n==resource.data.n+1;allow delete:if adm();}
 match /admins/{u}{allow get:if request.auth!=null&&request.auth.uid==u;allow list,write:if adm();}
}}
ধাপ ৩ - প্রথম অ্যাডমিন (একবারই):
  Authentication > Users > Add user: ইমেইল  ইউজারনেম@akano-admin.com  (যেমন ahmad@akano-admin.com) + পাসওয়ার্ড।
  ওই ইউজারের UID কপি করুন। Firestore > collection "admins" > Document ID = সেই UID,

  'কীভাবে কমিকস কিনব?':'How do I buy a comic?','কমিকসের কার্ডে ট্যাপ করুন। অর্ডার ফর্মে নাম, ইমেইল, ফোন, হোয়াটসঅ্যাপ নম্বর, পেমেন্টের মাধ্যম ও (পেমেন্টের পর) ট্রানজেকশন আইডি দিয়ে অর্ডার পাঠান।':'Tap a comic card. Enter your name, email, phone, WhatsApp number, payment method, and transaction ID in the order form, then submit it.','কীভাবে টাকা পাঠাব?':'How do I pay?','ফর্মে যে মাধ্যমে (বিকাশ, নগদ, রকেট বা অন্যান্য) টাকা পাঠাতে চান সেটি বেছে নিন। সেই মাধ্যম অনুযায়ী আমরা যোগাযোগ করে পেমেন্টের নম্বর জানাব।':'Choose a payment method in the form (bKash, Nagad, Rocket, or another option). We will contact you with the payment number.','কোড কীভাবে ও কখন পাব?':'How and when will I receive my code?','পেমেন্ট যাচাইয়ের পর আপনার ইমেইল বা হোয়াটসঅ্যাপে কোড পাঠানো হয়।':'After payment is verified, your code will be sent by email or WhatsApp.','কোড কীভাবে ব্যবহার করব?':'How do I use my code?','কোডের মেয়াদ কত দিন?':'How long is the code valid?','একটি কোড কয়টি ডিভাইসে চলে?':'How many devices can use one code?','ফ্রি কমিকস পড়তে কি কোড লাগে?':'Do free comics need a code?','ওয়ানশট আর সিরিজ কী?':'What is the difference between a one-shot and a series?','পড়া কি মনে থাকে?':'Is my reading progress saved?','স্ক্রিনশট বা শেয়ার করা যাবে?':'Can I take screenshots or share a comic?','সমস্যা হলে কোথায় জানাব?':'Where can I report a problem?','এখনো কোনো রিভিউ নেই। প্রথম রিভিউ আপনিই দিন!':'No reviews yet. Be the first to leave one!','কমিকস বা ক্যারেক্টারের কার্ডের হার্ট আইকনে ট্যাপ করলে এখানে জমা হবে (এই ডিভাইসে)।':'Tap the heart on a comic or character card to save it here on this device.','কোড দিয়ে কেনা কমিকস এখানে মেয়াদ অনুযায়ী (২০ দিন) জমা থাকবে (এই ডিভাইসে)।':'Comics purchased with a code are saved here for 20 days on this device.','কোনো ঘোষণা নেই':'No announcements','পড় কমিকস':'Read comics','ফেসবুক গ্রুপে যোগ দিন':'Join the Facebook group','আপনার ইমেইল':'Your email','আমি যে মাধ্যমে টাকা পাঠাতে চাই':'Choose a payment method','কোডের জন্য অর্ডার পাঠান':'Submit order for a code','পেম  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),isS=f.type==='series',pr=Number(f.price)||0,fr=!!f.free;
  if(!fr&&pr<=0)return alert('পেইড করতে দাম দিন (০ এর বেশি)');

   const patch={title:f.title.trim(),price:fr?(pr||q.price||0):pr,free:fr,feat:!!f.feat,type:isS?'series':'oneshot',series:isS?f.series.trim():'',ep:isS?+f.ep:0,creator:f.creator.trim(),t:Date.now()};if(f.cover.trim())patch.cover=f.cover.trim();
  try{await updateDoc(D('comics',id),patch);cl();refresh()}catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}}}

  Object.assign(x,{title:f.title.trim()||x.title,desc:f.desc.trim(),vid:pp.vid,h:pp.h,thumb:f.thumb.trim(),price:Math.max(0,+f.price||0),feat:!!f.feat});

async function mk(id,email){if(!id)return alert('কমিকস বা ভিডিও বাছাই করুন');const isVd=String(id).startsWith('v_'),ttl=isVd?vds.find(y=>y.id===id.slice(2))?.title:comics[id]?.title;
 const code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
 await setDoc(D('codes',code),{comicId:id,email:email||'',t:Date.now()});refresh();
 if(email)open(`mailto:${email}?subject=${encodeURIComponent(isVd?'আকানো! ভিডিওর কোড':'আকানো! কমিকসের কোড')}&body=${encodeURIComponent(isVd?`আপনার কোড: ${code}\nভিডিও: ${ttl}\nআকানো সাইটের ভিডিওর কার্ডে ট্যাপ করে “কোড আছে?” অংশে কোডটি দিন।`:`আপনার কোড: ${code}\nকমিকস: ${ttl}\nআকানো সাইটের কমিকসের কার্ডে ট্যাপ করে “কোড আছে?” অংশে কোডটি দিন।`)}`);else prompt('কোড:',code)}

function toast(m){let t=$('#tos');if(!t){t=document.createElement('div');t.id='tos';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2200)}
function adminStats(cs,o,k,rv,quiet){const fr=cs.filter(c=>c.free),pend=rv.filter(x=>!x.approved).length;
 $('#as1').textContent=bn(cs.length);$('#as1b').textContent=bn(cs.length-fr.length)+' পেইড · '+bn(fr.length)+' ফ্রি';

 $('#as5').textContent=bn(fr.reduce((t,c)=>t+(c.views||0),0));

 if(!quiet)toast('আপডেট হয়েছে')}

 comics=Object.fromEntries(cs.map(c=>[c.id,c]));

 vds=[...vd].sort(by);vv=await vviews();
 $('#vls').innerHTML=vds.map(x=>`<div class=al>${x.thumb?`<img src="${esc(x.thumb)}" alt="">`:''}<span><b>${esc(x.title)}</b> | ${+x.price>0?bn(x.price)+' টাকা':'ফ্রি'} | ${x.feat?'ফিচারড':'সাধারণ'} | ভিউ: ${bn(vv[x.id]||0)}</span><button data-vpv="${esc(x.id)}">দেখুন</button><button data-vft="${esc(x.id)}">${x.feat?'ফিচারড সরান':'ফিচারড করুন'}</button><button data-ved="${esc(x.id)}">এডিট</button><button data-vdel="${esc(x.id)}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#rvl').innerHTML=rv.sort(by).map(x=>`<div class=al><span><b>${esc(x.name)}</b> | ${bn(x.rating)}/৫ | ${esc(x.comic||'সাধারণ')} | ${x.approved?'অনুমোদিত':'অপেক্ষমাণ'}<br>${esc(x.text)}</span>${x.approved?'':`<button data-apv="${x.id}">অনুমোদন</button>`}<button data-del="reviews/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#gl').innerHTML=g.sort(by).map(x=>`<div class=al><img src="${esc(x.th)}" width=48 alt=""><span>${esc(x.cap||'-')}</span><button data-edit="gallery/${x.id}">এডিট</button><button data-del="gallery/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cl').innerHTML=cs.sort(by).map(c=>`<div class=al><img src="${esc(c.cover)}" width=36 alt=""><span>${esc(c.title)} &mdash; ${c.free?'ফ্রি':bn(c.price)+' টাকা'}${c.type==='series'&&c.series?' | '+esc(c.series)+' (পর্ব '+bn(c.ep||1)+')':' | ওয়ানশট'}${c.free?' | ভিউ: '+bn(c.views||0):''}</span><button data-cft="${c.id}">${c.feat?'ফিচারড সরান':'ফিচারড করুন'}</button><button data-edit="comics/${c.id}">এডিট</button><button data-del="comics/${c.id}" data-also="pages">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cs').innerHTML=cs.filter(c=>!c.free).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')+vds.filter(x=>+x.price>0).map(x=>`<option value="v_${esc(x.id)}">[ভিডিও] ${esc(x.title)}</option>`).join('');
 $('#ol').innerHTML=o.sort(by).map(x=>`<div class=al><span><b>${esc(x.comic)}</b><br>${esc(x.name)} | ${esc(x.email)} | ${esc(x.phone)} | হোয়াটসঅ্যাপ: ${x.whatsapp?`<a href="https://wa.me/${wa(x.whatsapp)}" target=_blank rel=noopener>${esc(x.whatsapp)}</a>`:'-'} | মাধ্যম: ${esc(x.method||'-')} | ট্রানজেকশন: ${esc(x.trx||'-')}</span><button data-mk="${x.comicId}" data-em="${esc(x.email)}">কোড পাঠান</button><button data-del="orders/${x.id}">মুছুন</button></div>`).join('')||'কোনো অর্ডার নেই';
 $('#kl').innerHTML=k.sort(by).map(x=>`<div class=al><span><b>${esc(x.id)}</b> | ${esc(String(x.comicId).startsWith('v_')?(vds.find(y=>y.id===String(x.comicId).slice(2))?.title?'[ভিডিও] '+vds.find(y=>y.id===String(x.comicId).slice(2)).title:'মুছে গেছে'):(comics[x.comicId]?.title||'মুছে গেছে'))} | ${esc(x.email||'-')} | <em class="${x.device?'u':'n'}">${x.device?'ব্যবহৃত':'নতুন'}</em>${+String(x.device||'').split('_')[1]?` | মেয়াদ: ${dateLabel(+String(x.device).split('_')[1]+20*864e5)}`:''}</span>${x.device?`<button data-rs="${x.id}">ডিভাইস রিসেট</button>`:''}<button data-del="codes/${x.id}">মুছুন</button></div>`).join('');
 adminStats(cs,o,k,rv,quiet);
 $('#al').innerHTML=a.map(x=>`<div class=al><span><b>${esc(x.name)}</b> | ${esc(x.user)}</span>${x.id===me.uid?'<i>আপনি</i>':`<button data-del="admins/${x.id}">সরান</button>`}</div>`).join('')}

// ---------- PWA: install করা যায় এমন অ্যাপ ----------
function pwaStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function pwaIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream}
function pwaBtn(){if(pwaStandalone()||!(window.__pwa||pwaIOS()))return'';return `<button class=adb id=pwaI>${ic('dl')}<span>অ্যাপ ইনস্টল করুন</span></button>`}
(()=>{
 if(!/^https?:$/.test(location.protocol))return;
 const icon=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#ff007b';x.fillRect(0,0,n,n);
  x.font=`800 ${Math.round(n*.5)}px Arial,Helvetica,sans-serif`;x.textBaseline='middle';x.textAlign='left';
  const a=x.measureText('A').width,b=x.measureText('!').width,l=n/2-(a+b)/2,y=n*.54;
  x.fillStyle='#ffffff';x.fillText('A',l,y);x.fillStyle='#eeff00';x.fillText('!',l+a,y);return c.toDataURL('image/png')};
 try{
  const base=location.origin+location.pathname,scope=location.origin+location.pathname.replace(/[^/]*$/,'');
  const m={id:base,name:'আকানো!',short_name:'আকানো',description:'দেশি কমিকস ও গল্পের ঠিকানা — আরডিবি স্টুডিও',start_url:base,scope,display:'standalone',orientation:'any',background_color:'#ffffff',theme_color:'#ff007b',lang:'bn',
   icons:[{src:icon(192),sizes:'192x192',type:'image/png',purpose:'any'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'any'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=icon(180);document.head.appendChild(ap);
 }catch{}
 window.addEventListener('beforeinstallprompt',()=>{try{renderNavigation()}catch{}});
 window.addEventListener('appinstalled',()=>{window.__pwa=null;try{renderNavigation()}catch{}});
 document.addEventListener('click',async e=>{const b=e.target.closest('#pwaI');if(!b)return;
  const p=window.__pwa;
  if(p){try{p.prompt();await p.userChoice}catch{}window.__pwa=null;try{renderNavigation()}catch{}return}
  alert(pwaIOS()?'Safari-র নিচের Share বাটনে চাপ দিয়ে “Add to Home Screen” বেছে নিন।':'ব্রাউজারের মেনু থেকে “Install app” বা “Add to Home screen” বেছে নিন।')});
 if(pwaStandalone())document.documentElement.classList.add('pwa');
})();
