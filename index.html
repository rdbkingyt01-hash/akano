ধাপ ১ - Firebase Console:
  Authentication > Sign-in method > Email/Password চালু করুন।
  Firestore Database তৈরি করুন (production mode)।
ধাপ ২ - Firestore > Rules এ এটি বসান:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&exists(/databases/$(d)/documents/admins/$(request.auth.uid));}
 match /site/{x}{allow read:if true;allow write:if adm();}
 match /comics/{x}{allow read:if true;allow write:if adm();}
 match /pages/{x}{allow read:if true;allow write:if adm();}
 match /gallery/{x}{allow read:if true;allow write:if adm();}
 match /news/{x}{allow read:if true;allow write:if adm();}
 match /orders/{x}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','method','trx','comicId','comic','price','t'])&&request.resource.data.name is string&&request.resource.data.name.size()<200;allow read,update,delete:if adm();}
 match /codes/{c}{allow get:if true;allow list,create,delete:if adm();
  allow update:if adm()||(!('device' in resource.data)&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&request.resource.data.device is string&&request.resource.data.device.size()<80);}
 match /reviews/{x}{allow read:if resource.data.approved==true||adm();allow create:if request.resource.data.keys().hasOnly(['name','rating','text','comic','approved','t'])&&request.resource.data.approved==false&&request.resource.data.rating is int&&request.resource.data.rating>=1&&request.resource.data.rating<=5&&request.resource.data.name is string&&request.resource.data.name.size()>0&&request.resource.data.name.size()<=60&&request.resource.data.text is string&&request.resource.data.text.size()>0&&request.resource.data.text.size()<=500&&request.resource.data.comic is string&&request.resource.data.comic.size()<=120;allow update,delete:if adm();}
 match /admins/{u}{allow get:if request.auth!=null&&request.auth.uid==u;allow list,write:if adm();}
}}
ধাপ ৩ - প্রথম অ্যাডমিন (একবারই):
  Authentication > Users > Add user: ইমেইল  ইউজারনেম@akano-admin.com  (যেমন ahmad@akano-admin.com) + পাসওয়ার্ড।
  ওই ইউজারের UID কপি করুন। Firestore > collection "admins" > Document ID = সেই UID,
  field: name (string, আপনার নাম), user (string, ইউজারনেম)।
  এরপর এই প্যানেল থেকেই আরও অ্যাডমিন যোগ করা যাবে।

 const EXP=20*864e5,now=nowT(),le=lib[code],[cd,ca]=String(c.device||'').split('_');let at=+ca||0;
 if(c.device&&cd!==dev)return'এই কোড আগেই ব্যবহার করা হয়েছে';
 if(!at&&le?.e)at=le.e-EXP;

 if(!at)at=now;
 if(now>at+EXP){lib[code]={t:le?.t||'কমিকস',e:at+EXP};try{localStorage.akLib=JSON.stringify(lib)}catch{}return'এই কোডের ২০ দিনের মেয়াদ শেষ হয়ে গেছে'}

 $('#logoUploadBtn').onclick=async()=>{const f=$('#lg').files[0];if(!f)return alert('ছবি বাছাই করুন');if(!f.type.startsWith('image/'))return alert('একটি image ফাইল বাছাই করুন');try{const url=await ib(f);await setDoc(D('site','logo'),{url,t:Date.now()});$('#logo').src=url;$('#logo').hidden=false;$('#lg').value='';alert('লোগো সেভ হয়েছে')}catch(e){alert('লোগো আপলোড ব্যর্থ: '+(e?.message||'ইন্টারনেট/API key/ImgBB সংযোগ পরীক্ষা করুন। কিছুক্ষণ পর আবার চেষ্টা করুন।'))}};
  $('#lgd').onclick=async()=>{if(!confirm('লোগো সরাবেন?'))return;try{await deleteDoc(D('site','logo'));$('#logo').hidden=true;$('#logo').removeAttribute('src');alert('লোগো সরানো হয়েছে')}catch{alert('লোগো সরানো যায়নি—Firestore Rules পরীক্ষা করুন')}};
 $('#hbb').onclick=async()=>{const f=$('#hb').files[0];if(!f)return alert('ব্যানার ছবি বাছাই করুন');try{const url=await ib(f);await setDoc(D('site','homeBanner'),{url,t:Date.now()});$('#hb').value='';alert('হোম ব্যানার সেভ হয়েছে');}catch(e){alert('ব্যানার আপলোড হয়নি: '+(e?.message||'ইন্টারনেট/API key পরীক্ষা করুন'))}};
 $('#hbd').onclick=async()=>{if(!confirm('হোম ব্যানার সরাবেন?'))return;try{await deleteDoc(D('site','homeBanner'));alert('ব্যানার সরানো হয়েছে');}catch{alert('ব্যানার সরানো যায়নি—Firestore Rules পরীক্ষা করুন')}};
 $('#ca').onclick=async()=>{const t=$('#ct').value.trim(),f=$('#cf').files[0],p=$('#cp').value,fr=$('#fr').checked;if(!t||!f||(!p&&!fr))return alert('শিরোনাম, দাম (বা ফ্রি টিক) ও PDF দিন');
  const ty=$('#cty').value,sr=$('#csr').value.trim(),ep=+$('#cep').value||0;if(ty==='series'&&(!sr||!ep))return alert('সিরিজের নাম ও পর্ব নম্বর দিন');
  try{const urls=await pdfPages(f,(i,n)=>$('#pr').textContent=`পেজ ${bn(i)}/${bn(n)} আপলোড হচ্ছে...`),cf=$('#cv').files[0],cover=cf?(await ib(cf),ib.th):pdfPages.th,id=doc(collection(db,'comics')).id;
   await setDoc(D('pages',id),{urls});await setDoc(D('comics',id),{title:t,price:fr?0:+p,free:fr,cover,type:ty,series:ty==='series'?sr:'',ep:ty==='series'?ep:0,creator:$('#ccr').value.trim(),t:Date.now(),ct:Date.now()});$('#pr').textContent='আপলোড সম্পূর্ণ';refresh()}
  catch(e){$('#pr').textContent='আপলোড ব্যর্থ: '+(e?.message||'ইন্টারনেট, ImgBB API key ও Firestore Rules পরীক্ষা করুন')}};
 $('#na').onclick=async()=>{const h=$('#nh').value.trim(),f=$('#ni').files[0];if(!h||!f)return alert('শিরোনাম ও ব্যানার ছবি দিন');
  try{const img=await ib(f);await setDoc(doc(collection(db,'news')),{type:$('#nt').value,title:h,text:$('#nb').value.trim(),img,link:$('#nk').value.trim(),t:Date.now()});['nh','nb','nk','ni'].forEach(i=>$('#'+i).value='');refresh()}catch{alert('প্রকাশ করা যায়নি')}};
 $('#ga').onclick=async()=>{const fs=[...$('#gi').files];if(!fs.length)return alert('ছবি বাছাই করুন');
  try{for(let i=0;i<fs.length;i++){$('#gp').textContent=`ছবি ${bn(i+1)}/${bn(fs.length)} আপলোড হচ্ছে...`;const url=await ib(fs[i]);await setDoc(doc(collection(db,'gallery')),{url,th:ib.th,cap:$('#gc').value.trim(),t:Date.now()+i})}
   $('#gp').textContent='আপলোড সম্পূর্ণ';$('#gc').value='';$('#gi').value='';refresh()}catch{$('#gp').textContent='আপলোড ব্যর্থ'}};
 $('#chb').onclick=async()=>{const n=$('#chn').value.trim(),f=$('#chi').files[0];if(!n||!f)return alert('নাম ও ছবি দিন');
  try{$('#chm').textContent='আপলোড হচ্ছে...';const img=await ib(f),th=ib.th,l=await chGet();
   l.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,series:$('#chs').value.trim(),app:$('#cha').value.trim(),desc:$('#chd').value.trim(),img,th,t:Date.now()});
   await chSave(l);['chn','chs','cha','chd','chi'].forEach(i=>$('#'+i).value='');$('#chm').textContent='ক্যারেক্টার যোগ হয়েছে';refresh()}
  catch(e){$('#chm').textContent='যোগ করা যায়নি: '+(e?.message||'ইন্টারনেট, ImgBB ও Firestore Rules পরীক্ষা করুন')}};
 $('#cg').onclick=()=>mk($('#cs').value,$('#ce').value.trim());
 $('#aa').onclick=async()=>{const n=$('#an').value.trim(),u=$('#au').value.trim().toLowerCase(),p=$('#ap').value;
  if(!n||!okUser(u)||p.length<6)return alert('নাম, সঠিক ইউজারনেম ও ৬+ অক্ষরের পাসওয়ার্ড দিন');
  try{const s=initializeApp(cfg,'s'+Date.now()),sa=getAuth(s),c=await createUserWithEmailAndPassword(sa,em(u),p);
   await setDoc(D('admins',c.user.uid),{name:n,user:u,t:Date.now()});await signOut(sa);
   ['an','au','ap'].forEach(i=>$('#'+i).value='');refresh();alert('অ্যাডমিন যোগ হয়েছে')}
  catch(x){alert(x.code==='auth/email-already-in-use'?'এই ইউজারনেম আগেই আছে':'যোগ করা যায়নি')}};
 $('#pw').onclick=async()=>{const p=prompt('নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর):');if(!p)return;if(p.length<6)return alert('খুব ছোট');
  try{await updatePassword(au.currentUser,p);alert('পাসওয়ার্ড বদলেছে')}catch{alert('নিরাপত্তার জন্য লগআউট করে আবার লগইন করে চেষ্টা করুন')}};
 $('#app').onclick=async e=>{const b=e.target.closest('button'),d=b?.dataset;if(!d)return;
  if(d.cdel){if(!confirm('মুছে ফেলবেন?'))return;try{await chSave((await chGet()).filter(x=>x.id!==d.cdel));refresh()}catch{alert('মুছা যায়নি')}return}
  if(d.ced){const l=await chGet(),x=l.find(y=>y.id===d.ced);if(!x)return alert('তথ্য পাওয়া যায়নি');
   const nm=prompt('নাম:',x.name);if(nm===null)return;const se=prompt('সিরিজ:',x.series||'');if(se===null)return;const ap=prompt('অ্যাপিয়ারেন্স:',x.app||'');if(ap===null)return;const ds=prompt('বিবরণ:',x.desc||'');if(ds===null)return;const im=prompt('নতুন ছবির URL (না বদলালে ফাঁকা রাখুন):','');if(im===null)return;
   Object.assign(x,{name:nm.trim()||x.name,series:se.trim(),app:ap.trim(),desc:ds.trim()});if(im.trim()){x.img=im.trim();x.th=im.trim()}
   try{await chSave(l);refresh()}catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}return}
  if(d.apv){try{await updateDoc(D('reviews',d.apv),{approved:true});refresh()}catch{alert('অনুমোদন করা যায়নি—Firestore Rules পরীক্ষা করুন')}return}
  if(d.del){if(d.del==='admins/'+me.uid)return alert('নিজেকে মুছা যাবে না');
   if(!confirm('মুছে ফেলবেন?'))return;const[c,i]=d.del.split('/');await deleteDoc(D(c,i));if(d.also)await deleteDoc(D(d.also,i));refresh()}
  if(d.edit){const [c,i]=d.edit.split('/');const q=await dat(c,i);if(!q)return alert('তথ্য পাওয়া যায়নি');
   try{
    if(c==='comics'){editComic(i,q);return}
    else if(c==='news'){const title=prompt('শিরোনাম:',q.title);if(title===null)return;const body=prompt('বিস্তারিত:',q.text||'');if(body===null)return;const link=prompt('লিংক:',q.link||'');if(link===null)return;await updateDoc(D(c,i),{title:title.trim(),text:body,link:link.trim(),t:Date.now()})}
    else if(c==='gallery'){const cap=prompt('ক্যাপশন:',q.cap||'');if(cap===null)return;const url=prompt('নতুন ছবির URL (না বদলালে ফাঁকা রাখুন):','');if(url===null)return;const patch={cap:cap.trim(),t:Date.now()};if(url.trim()){patch.url=url.trim();patch.th=url.trim()}await updateDoc(D(c,i),patch)}
    refresh()
   }catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}}
  if(d.rs){await updateDoc(D('codes',d.rs),{device:deleteField()});refresh()}
  if(d.mk)mk(d.mk,d.em)};
 refresh()}

function editComic(id,q){
 const d=document.createElement('dialog');d.className='cedit';
 d.innerHTML=`<form id=cef><h3>কমিকস এডিট</h3><input name=title value="${esc(q.title)}" placeholder="কমিকসের নাম" required><label style="display:flex;align-items:center;gap:10px"><input type=checkbox name=free style="width:auto"${q.free?' checked':''}> ফ্রি কমিকস (কোড লাগবে না)</label><input name=price type=number value="${q.price||''}" placeholder="দাম (টাকা)"><input name=cover placeholder="নতুন কভার ছবির URL (না বদলালে ফাঁকা রাখুন)"><select name=type><option value=oneshot${q.type!=='series'?' selected':''}>ওয়ানশট (একক কমিকস)</option><option value=series${q.type==='series'?' selected':''}>সিরিজ (চলমান, পর্ব আছে)</option></select><input name=series value="${esc(q.series||'')}" placeholder="সিরিজের নাম"><input name=ep type=number min=1 value="${q.ep||''}" placeholder="পর্ব নম্বর"><input name=creator value="${esc(q.creator||'')}" placeholder="ক্রিয়েটরের নাম (ঐচ্ছিক)"><div class=row><button class=btn>সংরক্ষণ</button><button type=button class=btn id=cxl>বাতিল</button></div></form>`;
 document.body.appendChild(d);d.showModal();
 const ty=d.querySelector('[name=type]'),fr=d.querySelector('[name=free]'),pi=d.querySelector('[name=price]'),tg=()=>{const on=ty.value==='series';d.querySelector('[name=series]').hidden=!on;d.querySelector('[name=ep]').hidden=!on;pi.hidden=fr.checked};tg();ty.onchange=tg;fr.onchange=tg;
 const cl=()=>{d.close();d.remove()};d.querySelector('#cxl').onclick=cl;d.addEventListener('cancel',()=>setTimeout(()=>d.remove(),0));
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),isS=f.type==='series',pr=Number(f.price)||0,fr=!!f.free;
  if(!fr&&pr<=0)return alert('পেইড করতে দাম দিন (০ এর বেশি)');
  if(isS&&(!f.series.trim()||!+f.ep))return alert('সিরিজের নাম ও পর্ব নম্বর দিন');
  const patch={title:f.title.trim(),price:fr?(pr||q.price||0):pr,free:fr,type:isS?'series':'oneshot',series:isS?f.series.trim():'',ep:isS?+f.ep:0,creator:f.creator.trim(),t:Date.now()};if(f.cover.trim())patch.cover=f.cover.trim();
  try{await updateDoc(D('comics',id),patch);cl();refresh()}catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}}}
async function mk(id,email){if(!id)return alert('কমিকস বাছাই করুন');
 const code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
 await setDoc(D('codes',code),{comicId:id,email:email||'',t:Date.now()});refresh();
 if(email)open(`mailto:${email}?subject=${encodeURIComponent('আকানো! কমিকসের কোড')}&body=${encodeURIComponent(`আপনার কোড: ${code}\nকমিকস: ${comics[id]?.title}\nআকানো সাইটের মেনু থেকে "কোড দিয়ে পড়ুন" এ কোডটি দিন।`)}`);else prompt('কোড:',code)}

async function refresh(){
 ['comics','news','gallery','chars'].forEach(k=>{try{localStorage.removeItem('ak_'+k)}catch{}});
 const[cs,o,k,a,n,g,ch,rv]=await Promise.all([all('comics'),all('orders'),all('codes'),all('admins'),all('news'),all('gallery'),chGet(),all('reviews').catch(()=>[])]),by=(x,y)=>(y.t||0)-(x.t||0);
 comics=Object.fromEntries(cs.map(c=>[c.id,c]));
 $('#nls').innerHTML=n.sort(by).map(x=>`<div class=al><img src="${esc(x.img)}" width=48 alt=""><span><b>${esc(x.type)}</b> | ${esc(x.title)}</span><button data-edit="news/${x.id}">এডিট</button><button data-del="news/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#chl').innerHTML=ch.map(x=>`<div class=al><img src="${esc(x.th||x.img)}" width=48 alt=""><span><b>${esc(x.name)}</b> | ${esc(x.series||'-')} | ${esc(x.app||'-')}</span><button data-ced="${esc(x.id)}">এডিট</button><button data-cdel="${esc(x.id)}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#rvl').innerHTML=rv.sort(by).map(x=>`<div class=al><span><b>${esc(x.name)}</b> | ${bn(x.rating)}/৫ | ${esc(x.comic||'সাধারণ')} | ${x.approved?'অনুমোদিত':'অপেক্ষমাণ'}<br>${esc(x.text)}</span>${x.approved?'':`<button data-apv="${x.id}">অনুমোদন</button>`}<button data-del="reviews/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#gl').innerHTML=g.sort(by).map(x=>`<div class=al><img src="${esc(x.th)}" width=48 alt=""><span>${esc(x.cap||'-')}</span><button data-edit="gallery/${x.id}">এডিট</button><button data-del="gallery/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cl').innerHTML=cs.sort(by).map(c=>`<div class=al><img src="${esc(c.cover)}" width=36 alt=""><span>${esc(c.title)} &mdash; ${c.free?'ফ্রি':bn(c.price)+' টাকা'}${c.type==='series'&&c.series?' | '+esc(c.series)+' (পর্ব '+bn(c.ep||1)+')':' | ওয়ানশট'}</span><button data-edit="comics/${c.id}">এডিট</button><button data-del="comics/${c.id}" data-also="pages">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cs').innerHTML=cs.filter(c=>!c.free).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
 $('#ol').innerHTML=o.sort(by).map(x=>`<div class=al><span><b>${esc(x.comic)}</b><br>${esc(x.name)} | ${esc(x.email)} | ${esc(x.phone)} | হোয়াটসঅ্যাপ: ${x.whatsapp?`<a href="https://wa.me/${wa(x.whatsapp)}" target=_blank rel=noopener>${esc(x.whatsapp)}</a>`:'-'} | মাধ্যম: ${esc(x.method||'-')} | ট্রানজেকশন: ${esc(x.trx||'-')}</span><button data-mk="${x.comicId}" data-em="${esc(x.email)}">কোড পাঠান</button><button data-del="orders/${x.id}">মুছুন</button></div>`).join('')||'কোনো অর্ডার নেই';
 $('#kl').innerHTML=k.sort(by).map(x=>`<div class=al><span><b>${esc(x.id)}</b> | ${esc(comics[x.comicId]?.title||'মুছে গেছে')} | ${esc(x.email||'-')} | <em class="${x.device?'u':'n'}">${x.device?'ব্যবহৃত':'নতুন'}</em>${+String(x.device||'').split('_')[1]?` | মেয়াদ: ${new Date(+String(x.device).split('_')[1]+20*864e5).toLocaleDateString('bn-BD')}`:''}</span>${x.device?`<button data-rs="${x.id}">ডিভাইস রিসেট</button>`:''}<button data-del="codes/${x.id}">মুছুন</button></div>`).join('');
 $('#al').innerHTML=a.map(x=>`<div class=al><span><b>${esc(x.name)}</b> | ${esc(x.user)}</span>${x.id===me.uid?'<i>আপনি</i>':`<button data-del="admins/${x.id}">সরান</button>`}</div>`).join('')}

cache('logo',()=>dat('site','logo')).then(l=>{if(l?.url){$('#logo').src=l.url;$('#logo').hidden=false}}).catch(()=>{});
if(location.hash==='#admin')openAdmin();else go('home');
</script>
