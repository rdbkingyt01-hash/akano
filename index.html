<!--
ধাপ ১ - Firebase Console:
  Authentication > Sign-in method > Email/Password চালু করুন।
  Firestore Database তৈরি করুন (production mode)।
ধাপ ২ - Firestore > Rules এ এটি বসান:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&exists(/databases/$(d)/documents/admins/$(request.auth.uid));}
 match /site/{x}{allow read:if true;allow write:if adm();}
 match /comics/{x}{allow read:if true;allow write:if adm();}
 match /pages/{x}{allow read:if true;allow write:if adm();}
 match /gallery/{x}{allow read:if true;allow write:if adm();}
 match /news/{x}{allow read:if true;allow write:if adm();}
 match /orders/{x}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','method','trx','comicId','comic','price','t'])&&request.resource.data.name is string&&request.resource.data.name.size()<200;allow read,update,delete:if adm();}
 match /codes/{c}{allow get:if true;allow list,create,delete:if adm();
  allow update:if adm()||(!('device' in resource.data)&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&request.resource.data.device is string&&request.resource.data.device.size()<80);}
 match /admins/{u}{allow get:if request.auth!=null&&request.auth.uid==u;allow list,write:if adm();}
}}
ধাপ ৩ - প্রথম অ্যাডমিন (একবারই):
  Authentication > Users > Add user: ইমেইল  ইউজারনেম@akano-admin.com  (যেমন ahmad@akano-admin.com) + পাসওয়ার্ড।
  ওই ইউজারের UID কপি করুন। Firestore > collection "admins" > Document ID = সেই UID,
  field: name (string, আপনার নাম), user (string, ইউজারনেম)।
  এরপর এই প্যানেল থেকেই আরও অ্যাডমিন যোগ করা যাবে।
-->

  try{await updatePassword(au.currentUser,p);alert('পাসওয়ার্ড বদলেছে')}catch{alert('নিরাপত্তার জন্য লগআউট করে আবার লগইন করে চেষ্টা করুন')}};
 $('#app').onclick=async e=>{const b=e.target.closest('button'),d=b?.dataset;if(!d)return;
  if(d.cdel){if(!confirm('মুছে ফেলবেন?'))return;try{await chSave((await chGet()).filter(x=>x.id!==d.cdel));refresh()}catch{alert('মুছা যায়নি')}return}
  if(d.ced){const l=await chGet(),x=l.find(y=>y.id===d.ced);if(!x)return alert('তথ্য পাওয়া যায়নি');
   const nm=prompt('নাম:',x.name);if(nm===null)return;const se=prompt('সিরিজ:',x.series||'');if(se===null)return;const ap=prompt('অ্যাপিয়ারেন্স:',x.app||'');if(ap===null)return;const ds=prompt('বিবরণ:',x.desc||'');if(ds===null)return;const im=prompt('নতুন ছবির URL (না বদলালে ফাঁকা রাখুন):','');if(im===null)return;
   Object.assign(x,{name:nm.trim()||x.name,series:se.trim(),app:ap.trim(),desc:ds.trim()});if(im.trim()){x.img=im.trim();x.th=im.trim()}
   try{await chSave(l);refresh()}catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}return}
  if(d.del){if(d.del==='admins/'+me.uid)return alert('নিজেকে মুছা যাবে না');
   if(!confirm('মুছে ফেলবেন?'))return;const[c,i]=d.del.split('/');await deleteDoc(D(c,i));if(d.also)await deleteDoc(D(d.also,i));refresh()}
  if(d.edit){const [c,i]=d.edit.split('/');const q=await dat(c,i);if(!q)return alert('তথ্য পাওয়া যায়নি');
   try{
    if(c==='comics'){const title=prompt('কমিকসের নাম:',q.title);if(title===null)return;const price=prompt('দাম (ফ্রি হলে 0):',q.price??0);if(price===null)return;const cover=prompt('নতুন কভার ছবির URL (না বদলালে ফাঁকা রাখুন):','');if(cover===null)return;const patch={title:title.trim(),price:Number(price),free:Number(price)===0,t:Date.now()};if(cover.trim())patch.cover=cover.trim();await updateDoc(D(c,i),patch)}
    else if(c==='news'){const title=prompt('শিরোনাম:',q.title);if(title===null)return;const body=prompt('বিস্তারিত:',q.text||'');if(body===null)return;const link=prompt('লিংক:',q.link||'');if(link===null)return;await updateDoc(D(c,i),{title:title.trim(),text:body,link:link.trim(),t:Date.now()})}
    else if(c==='gallery'){const cap=prompt('ক্যাপশন:',q.cap||'');if(cap===null)return;const url=prompt('নতুন ছবির URL (না বদলালে ফাঁকা রাখুন):','');if(url===null)return;const patch={cap:cap.trim(),t:Date.now()};if(url.trim()){patch.url=url.trim();patch.th=url.trim()}await updateDoc(D(c,i),patch)}
    refresh()
   }catch{alert('এডিট করা যায়নি—Firestore Rules পরীক্ষা করুন')}}
  if(d.rs){await updateDoc(D('codes',d.rs),{device:deleteField()});refresh()}
  if(d.mk)mk(d.mk,d.em)};
 refresh()}

async function mk(id,email){if(!id)return alert('কমিকস বাছাই করুন');
 const code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
 await setDoc(D('codes',code),{comicId:id,email:email||'',t:Date.now()});refresh();
 if(email)open(`mailto:${email}?subject=${encodeURIComponent('আকানো! কমিকসের কোড')}&body=${encodeURIComponent(`আপনার কোড: ${code}\nকমিকস: ${comics[id]?.title}\nআকানো সাইটের মেনু থেকে "কোড দিয়ে পড়ুন" এ কোডটি দিন।`)}`);else prompt('কোড:',code)}

async function refresh(){
 ['comics','news','gallery','chars'].forEach(k=>{try{localStorage.removeItem('ak_'+k)}catch{}});
 const[cs,o,k,a,n,g,ch]=await Promise.all([all('comics'),all('orders'),all('codes'),all('admins'),all('news'),all('gallery'),chGet()]),by=(x,y)=>(y.t||0)-(x.t||0);
 comics=Object.fromEntries(cs.map(c=>[c.id,c]));
 $('#nls').innerHTML=n.sort(by).map(x=>`<div class=al><img src="${esc(x.img)}" width=48 alt=""><span><b>${esc(x.type)}</b> | ${esc(x.title)}</span><button data-edit="news/${x.id}">এডিট</button><button data-del="news/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#chl').innerHTML=ch.map(x=>`<div class=al><img src="${esc(x.th||x.img)}" width=48 alt=""><span><b>${esc(x.name)}</b> | ${esc(x.series||'-')} | ${esc(x.app||'-')}</span><button data-ced="${esc(x.id)}">এডিট</button><button data-cdel="${esc(x.id)}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#gl').innerHTML=g.sort(by).map(x=>`<div class=al><img src="${esc(x.th)}" width=48 alt=""><span>${esc(x.cap||'-')}</span><button data-edit="gallery/${x.id}">এডিট</button><button data-del="gallery/${x.id}">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cl').innerHTML=cs.sort(by).map(c=>`<div class=al><img src="${esc(c.cover)}" width=36 alt=""><span>${esc(c.title)} &mdash; ${c.free?'ফ্রি':bn(c.price)+' টাকা'}</span><button data-edit="comics/${c.id}">এডিট</button><button data-del="comics/${c.id}" data-also="pages">মুছুন</button></div>`).join('')||'কিছু নেই';
 $('#cs').innerHTML=cs.filter(c=>!c.free).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
 $('#ol').innerHTML=o.sort(by).map(x=>`<div class=al><span><b>${esc(x.comic)}</b><br>${esc(x.name)} | ${esc(x.email)} | ${esc(x.phone)} | হোয়াটসঅ্যাপ: ${x.whatsapp?`<a href="https://wa.me/${wa(x.whatsapp)}" target=_blank rel=noopener>${esc(x.whatsapp)}</a>`:'-'} | মাধ্যম: ${esc(x.method||'-')} | ট্রানজেকশন: ${esc(x.trx||'-')}</span><button data-mk="${x.comicId}" data-em="${esc(x.email)}">কোড পাঠান</button><button data-del="orders/${x.id}">মুছুন</button></div>`).join('')||'কোনো অর্ডার নেই';
 $('#kl').innerHTML=k.sort(by).map(x=>`<div class=al><span><b>${esc(x.id)}</b> | ${esc(comics[x.comicId]?.title||'মুছে গেছে')} | ${esc(x.email||'-')} | <em class="${x.device?'u':'n'}">${x.device?'ব্যবহৃত':'নতুন'}</em>${+String(x.device||'').split('_')[1]?` | মেয়াদ: ${new Date(+String(x.device).split('_')[1]+20*864e5).toLocaleDateString('bn-BD')}`:''}</span>${x.device?`<button data-rs="${x.id}">ডিভাইস রিসেট</button>`:''}<button data-del="codes/${x.id}">মুছুন</button></div>`).join('');
 $('#al').innerHTML=a.map(x=>`<div class=al><span><b>${esc(x.name)}</b> | ${esc(x.user)}</span>${x.id===me.uid?'<i>আপনি</i>':`<button data-del="admins/${x.id}">সরান</button>`}</div>`).join('')}

cache('logo',()=>dat('site','logo')).then(l=>{if(l?.url){$('#logo').src=l.url;$('#logo').hidden=false}}).catch(()=>{});
if(location.hash==='#admin')openAdmin();else go('home');
</script>
</body>
