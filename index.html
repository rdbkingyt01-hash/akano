  const cats=(a.cats||'').split(',').map(s=>s.trim()).filter(Boolean);
  $('#m').innerHTML=`<button class="bkb" onclick="goBack()" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>${a.banner?`<img class="banner" src="${E(a.banner)}">`:''}
  <div class="top"><img class="ico" src="${E(a.icon)}"><div><h3>${E(a.name)}</h3><p>${E(a.dev)}</p><small>${[a.ads?t('ads'):'',a.iap?t('iap'):''].filter(Boolean).join(' · ')}</small></div></div>
  <div class="st"><div><b id="a2">—</b><span><i id="rc" style="font-style:normal">0</i> ${t('rv')}</span></div><div><b>${a.downloads||0}</b><span>${t('dls')}</span></div><div><b>${fmt(a.size)}</b><span>v${E(a.ver||'1.0.0')}</span></div></div>
  <button class="btn gr" onclick="dl('${id}')">${t('dl')}</button>
  ${(a.shots||[]).length?`<div class="shots">${a.shots.map(s=>`<img src="${E(s)}">`).join('')}</div>`:''}
  ${a.wn?`<h2>${t('wn')}</h2><p style="white-space:pre-wrap">${E(a.wn)}</p>`:''}
  ${a.desc?`<h2>${t('about')}</h2><p style="white-space:pre-wrap">${E(a.desc)}</p>`:''}
  ${cats.length?`<div class="chips" style="margin-top:16px">${cats.map(c=>`<span class="chip">${E(c)}</span>`).join('')}</div>`:''}
  <h2>${t('rat')}</h2><div id="rsm"></div><div id="rf"></div><div id="rl"></div>`;
  $('#m').querySelectorAll('.shots img').forEach((im,i)=>im.onclick=()=>lbOpen(a.shots,i));
  const un=db.collection('apps').doc(id).collection('reviews').onSnapshot(s=>{const v={};s.forEach(d=>v[d.id]=d.data());const l=Object.entries(v).map(([k,x])=>({k,...x})).sort((x,y)=>y.ts-x.ts);
    const n=l.length,av=n?l.reduce((q,x)=>q+x.rating,0)/n:0,avs=n?av.toFixed(1):'';
    $('#rc').textContent=n;$('#a2').innerHTML=avs?avs+' '+SV('#FFCC00',15):'—';
    const cn=[5,4,3,2,1].map(r=>l.filter(x=>x.rating===r).length);
    $('#rsm').innerHTML=n?`<div class="rsum"><div class="big"><b>${avs}</b><div>${[1,2,3,4,5].map(i=>SV(i<=Math.round(av)?'#FFCC00':'#d9d9d9',16)).join('')}</div><small>${n} ${t('rv')}</small></div><div class="dist">${cn.map((c,i)=>`<div><span>${5-i}</span><div class="tr"><i style="width:${c/n*100}%"></i></div></div>`).join('')}</div></div>`:`<p style="color:#6b6b6b;margin-bottom:12px">${t('nor')}</p>`;
    $('#rl').innerHTML=l.map(x=>`<div class="rev"><b>${E(x.name)}</b> <span style="white-space:nowrap">${[1,2,3,4,5].map(i=>SV(i<=x.rating?'#FFCC00':'#d9d9d9',14)).join('')}</span><br><small>${new Date(x.ts).toLocaleDateString()}</small>${x.text?`<p>${E(x.text)}</p>`:''}</div>`).join('');
    form(id,U&&v[U.uid])});
  offs.push(un);
}
let rate=0;
function form(id,mine){const f=$('#rf');if(!f)return;
  const key=(U?U.uid:'')+'|'+(mine?mine.rating+'|'+mine.text:'-');if(f.dataset.k===key&&f.innerHTML)return;f.dataset.k=key;
  if(!U)return f.innerHTML=`<button class="btn o sm" onclick="location.hash='#/me'">${t('lr')}</button>`;
  rate=mine?mine.rating:0;
  f.innerHTML=`<p style="font-weight:600;margin:4px 0">${mine?t('yr'):t('write')}</p><div class="stars">${[1,2,3,4,5].map(i=>`<span data-i="${i}" class="${i<=rate?'on':''}">${SV('#b5b5b5',34)}</span>`).join('')}</div><textarea id="rt" rows="3" placeholder="${t('write')}">${E(mine?mine.text:'')}</textarea><div style="display:flex;gap:8px"><button class="btn sm" id="rs">${mine?t('upd'):t('post')}</button>${mine?`<button class="btn o sm" id="rd">${t('del')}</button>`:''}</div>`;
  f.querySelectorAll('.stars span').forEach(s=>s.onclick=()=>{rate=+s.dataset.i;f.querySelectorAll('.stars span').forEach(x=>x.classList.toggle('on',+x.dataset.i<=rate))});
  const ref=db.collection('apps').doc(id).collection('reviews').doc(U.uid);
  $('#rs').onclick=async()=>{if(!rate)return toast(t('pick'));const o={rating:rate,text:$('#rt').value.trim().slice(0,500)};
    try{if(mine)await ref.update({...o,edited:Date.now()});else await ref.set({...o,name:U.displayName||U.email.split('@')[0],ts:Date.now()});toast(t('saved'))}catch(e){toast(e.message)}};
  if(mine)$('#rd').onclick=async()=>{if(!confirm(t('conf')))return;try{await ref.delete();f.dataset.k='';toast(t('delok'))}catch(e){toast(e.message)}}}

async function dl(id){
  const a=APPS[id];if(!U){toast(t('needlogin'));location.hash='#/me';return}
  const ap=db.collection('apps').doc(id),r=ap.collection('dl').doc(U.uid);let ok=false;
  try{await db.runTransaction(async tx=>{const s=await tx.get(r),n=Date.now();
    if(!s.exists||n-s.data().ts.toMillis()>864e5){tx.set(r,{ts:FV.serverTimestamp()});tx.update(ap,{downloads:FV.increment(1)});ok=true}})}catch(e){console.error(e)}
  const l=document.createElement('a');l.href=a.apk;l.download='';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();
}

function me(){const m=$('#m');
  if(U){m.innerHTML=`<h2>${E(U.displayName||t('acc'))}</h2><p>${E(U.email)}</p><button class="btn o" onclick="auth.signOut()">${t('out')}</button>${insBox()}`;
    return}
  m.innerHTML=`<h2>${t('acc')}</h2><div id="nw" style="display:none"><label>${t('name')}</label><input id="nm"></div><label>${t('email')}</label><input id="e" type="email" placeholder="example@gmail.com"><label>${t('pass')}</label><input id="p" type="password"><button class="btn" id="go">${t('login')}</button><p style="text-align:center;margin-top:14px"><a href="#" id="tg" style="color:#000;font-weight:600">${t('noacc')}</a></p>${insBox()}`;
  let up=false;const go=p=>p.catch(e=>toast(e.message));
  $('#tg').onclick=e=>{e.preventDefault();up=!up;$('#nw').style.display=up?'block':'none';$('#go').textContent=up?t('su'):t('login');$('#tg').textContent=up?t('has'):t('noacc')};
  $('#go').onclick=()=>{const em=$('#e').value.trim(),pw=$('#p').value;
    if(!up)return go(auth.signInWithEmailAndPassword(em,pw));
    const nm=$('#nm').value.trim();if(!nm)return toast(t('nn'));
    const lp=em.toLowerCase().split('@')[0];if(!/^[^@\s]+@gmail\.com$/i.test(em)||lp.includes('+'))return toast(t('gonly'));
    let arr=[];try{arr=JSON.parse(localStorage.getItem('su')||'[]').filter(x=>Date.now()-x<864e5)}catch(e){}
    if(arr.length>=2)return toast(t('lim'));
    go((async()=>{const c=await auth.createUserWithEmailAndPassword(em,pw);
      try{await db.collection('emails').doc(lp.replace(/\./g,'')+'@gmail.com').set({uid:c.user.uid})}catch(e){await c.user.delete();throw new Error(t('used'))}
      await c.user.updateProfile({displayName:nm});
      try{arr.push(Date.now());localStorage.setItem('su',JSON.stringify(arr))}catch(e){}
      setAv();route()})())};
}

</script></body></html>
