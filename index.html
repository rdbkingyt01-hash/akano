ধাপ ১ - Firebase Console:
  Authentication > Sign-in method > Email/Password চালু করুন।
  Firestore Database তৈরি করুন (production mode)।
ধাপ ২ - Firestore > Rules এ এটি বসান:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&exists(/databases/$(d)/documents/admins/$(request.auth.uid));}
 match /site/{x}{allow read:if true;allow write:if adm();}
 match /vsecure/{x}{allow read,write:if adm();}
 match /comics/{x}{allow read:if true;allow create,delete:if adm();allow update:if adm()||(request.resource.data.diff(resource.data).affectedKeys().hasOnly(['views'])&&request.resource.data.views is int&&request.resource.data.views==resource.data.get('views',0)+1);}
 match /pages/{x}{allow read:if true;allow write:if adm();}
 match /gallery/{x}{allow read:if true;allow write:if adm();}
 match /news/{x}{allow read:if true;allow write:if adm();}
 match /orders/{x}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','method','lang','trx','comicId','comic','price','t'])&&request.resource.data.name is string&&request.resource.data.name.size()<200;allow read,update,delete:if adm();}
 match /codes/{c}{allow get:if true;allow list,create,delete:if adm();
  allow update:if adm()||(!('device' in resource.data)&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&request.resource.data.device is string&&request.resource.data.device.size()<80);}
 match /reviews/{x}{allow read:if resource.data.approved==true||adm();allow create:if request.resource.data.keys().hasOnly(['name','rating','text','comic','approved','t'])&&request.resource.data.approved==false&&request.resource.data.rating is int&&request.resource.data.rating>=1&&request.resource.data.rating<=5&&request.resource.data.name is string&&request.resource.data.name.size()>0&&request.resource.data.name.size()<=60&&request.resource.data.text is string&&request.resource.data.text.size()>0&&request.resource.data.text.size()<=500&&request.resource.data.comic is string&&request.resource.data.comic.size()<=120;allow update,delete:if adm();}
 match /videoViews/{x}{allow read:if true;allow create:if request.resource.data.keys().hasOnly(['n'])&&request.resource.data.n==1;allow update:if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['n'])&&request.resource.data.n==resource.data.n+1;allow delete:if adm();}
 match /admins/{u}{allow get:if request.auth!=null&&request.auth.uid==u;allow list,write:if adm();}
}}
ধাপ ৩ - প্রথম অ্যাডমিন (একবারই):
  Authentication > Users > Add user: ইমেইল  ইউজারনেম@akano-admin.com  (যেমন ahmad@akano-admin.com) + পাসওয়ার্ড।
  ওই ইউজারের UID কপি করুন। Firestore > collection "admins" > Document ID = সেই UID,
  field: name (string, আপনার নাম), user (string, ইউজারনেম)।
  এরপর এই প্যানেল থেকেই আরও অ্যাডমিন যোগ করা যাবে।
-->
<style>
:root{--r:#e10600;--k:#0d0d0d;--g:#dcdcdc;--l:#e8e8e8;--m:#666}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--k);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}img{max-width:100%}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{to{width:90px}}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
@keyframes sheet{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes land{from{opacity:0;transform:translateY(46px) rotate(0)}to{opacity:1;transform:translateY(0) rotate(var(--a))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--a))}50%{transform:translateY(-9px) rotate(var(--a))}}
#app>*{animation:fadein .4s both}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--r);z-index:20}
header{position:sticky;top:12px;z-index:4;margin:14px auto 0;width:min(92%,1100px);height:70px;background:var(--g);border-radius:24px;display:flex;align-items:center;justify-content:flex-start;padding:0 18px;transition:box-shadow .3s}
header.sh{box-shadow:0 12px 26px -10px #0004}
#lgb{background:none;border:0;display:flex;align-items:center;justify-content:flex-start}#logo{height:50px;max-width:60vw;object-fit:contain}#lt{font-size:34px;font-weight:700;color:var(--r)}
#mb{position:absolute;right:22px;background:none;border:0;padding:6px;display:flex;transition:transform .2s}#mb:active{transform:scale(.92)}

/* ===== clean reviews ===== */
.rv-page{max-width:620px;margin:0 auto;padding:14px 5% 56px}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
.rv-top h1.ct{margin:0!important;font-size:clamp(24px,6vw,30px)!important;line-height:1.2!important;color:#111111}
.rv-top h1.ct span{display:inline!important;margin-left:6px}
.rv-sum{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.25}
.rv-sum-row{display:flex;align-items:center;gap:7px}
.rv-sum-row b{font-size:22px;color:#111111}
.rv-sum small{font-size:12px;color:#8a8a8a}
.rv-page .rs{gap:1px}
.rv-page .rs i .ic{width:14px;height:14px;color:#ddd4dc;fill:none}
.rv-page .rs i.on .ic{color:#111111;fill:#111111}
.rv-write{margin:0 0 16px;border:1px solid #e4e4e4;border-radius:16px;background:#fff;overflow:hidden}
.rv-write>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;font-size:15px;font-weight:600;color:#c40500}
.rv-write>summary::-webkit-details-marker{display:none}
.rv-write>summary:after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.rv-write[open]>summary:after{transform:rotate(-135deg);margin-top:4px}
.rv-form{position:relative;display:grid;gap:10px;padding:2px 16px 16px}
.rv-form select,.rv-form input:not([name=website]),.rv-form textarea{width:100%;min-height:42px;padding:10px 12px;border:0;border-radius:10px;background:#f2f2f2;font-size:14.5px;color:#111111;outline:none;box-shadow:none}
.rv-form textarea{min-height:88px;resize:vertical;line-height:1.6}
.rv-form select:focus,.rv-form input:focus,.rv-form textarea:focus{box-shadow:0 0 0 2px rgba(225,6,0,.35)}
.rv-rate{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv-rate .rt{gap:0}
.rv-rate .rt button{display:grid;place-items:center;width:32px;height:32px;padding:0;color:#d9d0d8}
.rv-rate .rt button.on{color:#111111}
.rv-rate .rt button.on .ic{fill:#111111}
.rv-rate .rt .ic{width:22px;height:22px}
.rv-hint{font-size:12.5px;color:#8a8a8a;text-align:right}
.rv-send{width:100%;min-height:42px;border:0;border-radius:12px;background:#e10600;color:#fff;font-size:15px;font-weight:600}
.rv-fb{margin:0;text-align:center;font-size:12px;color:#8a8a8a}
.rv-fb a{display:inline-flex;align-items:center;gap:5px;color:#8a8a8a;text-decoration:none}
.rv-fb svg{width:12px;height:12px;flex:none}
.rv-msg{margin:0;font-size:13.5px;line-height:1.6;color:#555555}
.rv-msg:empty{display:none}
.rv-list{display:grid}
.rv-card{padding:14px 2px;border-bottom:1px solid #e4e4e4}
.rv-card:last-child{border-bottom:0}
.rv-head{display:flex;align-items:center;gap:10px}
.rv-av{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#f2f2f2;color:#c40500;font-size:15px;font-weight:600}
.rv-meta{flex:1;min-width:0;display:grid;line-height:1.3}
.rv-meta b{font-size:14.5px;color:#111111;overflow-wrap:anywhere}
.rv-meta small{font-size:12px;color:#8a8a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-card p{margin:8px 0 0 44px;font-size:14.5px;line-height:1.7;color:#4a414d;white-space:pre-line;overflow-wrap:anywhere}
.rv-empty{text-align:center;padding:26px 10px}
.rv-empty h3{margin:0 0 4px;font-size:16px;color:#302234}
.rv-empty p{margin:0;font-size:13.5px;line-height:1.65;color:#8a8a8a}
@media(max-width:420px){.rv-card p{margin-left:0}}

/* ===== clean purchase page ===== */
.pc-top{display:flex;gap:14px;align-items:center;margin:2px 0 14px}
.pc-top img{flex:0 0 84px;width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;box-shadow:0 12px 20px -12px #0007}
.pc-top img.v{flex:0 0 132px;width:132px;aspect-ratio:16/9}
.pc-top>div{flex:1;min-width:0;overflow-wrap:anywhere}
.pc-ty{display:inline-block;margin-bottom:6px;padding:2px 10px;border-radius:99px;background:#f2f2f2;color:#555555;font-size:12px}
.pc-top h2{margin:0 0 6px;font-size:19px;line-height:1.3}
.pc-pr{display:block;font-size:22px;font-weight:700;color:#e10600;line-height:1.2}
.pc-how{display:flex;gap:6px;list-style:none;margin:0 0 14px;padding:10px 12px;background:#f2f2f2;border-radius:12px;counter-reset:n;font-size:12.5px;color:#555555}
.pc-how li{flex:1;display:flex;align-items:center;gap:6px;counter-increment:n;line-height:1.3}
.pc-how li:before{content:counter(n,bengali);flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#f2f2f2;color:#c40500;font-size:11.5px;font-weight:600}
html[lang=en] .pc-how li:before{content:counter(n,decimal)}
.pc-f{display:grid;gap:10px}
.pc-f input:not([type=radio]),.pc-code input{width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:#f2f2f2;font-size:14.5px;color:#111111;outline:none;box-shadow:none}
.pc-f input:focus,.pc-code input:focus{box-shadow:0 0 0 2px rgba(225,6,0,.35)}
.pc-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.pc-2{grid-template-columns:1fr}}
.pc-lb{margin:2px 0 -4px;font-size:12.5px;color:#8a8a8a}
.pc-m{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc-m label{position:relative;display:block}
.pc-m input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.pc-m span{display:block;padding:10px 4px;text-align:center;border-radius:10px;background:#f2f2f2;border:1.5px solid transparent;font-size:14px;color:#4a414d}
.pc-m input:checked+span{background:#f2f2f2;border-color:#e10600;color:#c40500;font-weight:600}
.pc-m input:focus-visible+span{box-shadow:0 0 0 2px rgba(225,6,0,.35)}
.pc-n{margin:0;font-size:12.5px;line-height:1.6;color:#8a8a8a}
.pc-n:empty{display:none}
.pc-code{display:flex;gap:8px}
.pc-code input{flex:1;min-width:0;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.pc-ok{text-align:center;padding:10px 4px 6px}
.pc-ok h3{margin:0 0 6px;font-size:18px}
.pc-ok p{margin:0;font-size:13.5px;line-height:1.7;color:#555555}
/* video resume */
.vc .vpg{position:absolute;left:0;bottom:0;height:3px;background:#e10600;border-radius:0 3px 3px 0;z-index:2}
#vp .vrs{position:absolute;left:12px;bottom:14px;z-index:4;padding:8px 14px;border:0;border-radius:999px;background:rgba(26,19,32,.8);color:#fff;font-size:13.5px}
#vp .vrs[hidden]{display:none}

.pc-top .favb{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%;margin-top:8px}
.pc-top .favb span{display:none}
.pc-l{grid-template-columns:repeat(2,1fr)}

/* ===== purchase library ===== */
.lb{max-width:640px;margin:0 auto}
.lb-list{display:grid;gap:12px;margin-top:14px}
.lb-card{display:flex;gap:14px;align-items:center;padding:12px;background:#fff;border:1px solid #e4e4e4;border-radius:18px;box-shadow:0 10px 24px -20px rgba(26,19,32,.5)}
.lb-card.end{opacity:.62}
.lb-th{flex:0 0 64px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#f2f2f2;display:grid;place-items:center;color:#cfc6d0}
.lb-th.v{flex-basis:96px;aspect-ratio:16/9}
.lb-th img{width:100%;height:100%;object-fit:cover;display:block}
.lb-th>.ic{width:28px;height:28px}
.lb-in{flex:1;min-width:0;display:grid;gap:5px}
.lb-tp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb-k,.lb-d{font-size:11.5px;padding:2px 9px;border-radius:99px;line-height:1.5}
.lb-k{background:#f2f2f2;color:#555555}
.lb-d{font-weight:600}
.lb-d.ok{background:#e6f6ec;color:#12803d}
.lb-d.warn{background:#fff3dc;color:#a76a00}
.lb-d.bad{background:#f2f2f2;color:#c0243a}
.lb-d.end{background:#eee;color:#777}
.lb-t{font-size:16px;line-height:1.35;color:#111111;overflow-wrap:anywhere}
.lb-pg{height:4px;border-radius:99px;background:#e4e4e4;overflow:hidden}
.lb-pg i{display:block;height:100%;background:#e10600;border-radius:99px}
.lb-card small{font-size:12px;line-height:1.4;color:#8a8a8a}
.lb-go{justify-self:start;min-height:0;margin-top:4px;padding:8px 20px;font-size:14px}
.lb-note{margin:16px 2px 0;text-align:center;font-size:12.5px;color:#8a8a8a}


.cedit .cvr{display:flex;gap:12px;align-items:center}
.cedit .cvr img{flex:0 0 64px;width:64px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#f2f2f2}
.cedit .cvr img.v{flex-basis:104px;width:104px;aspect-ratio:16/9}
.cedit .cvl{flex:1;min-width:0;display:grid;gap:6px;font-size:13px;color:#555555}
.cedit .cvl input{font-size:12.5px;max-width:100%}
.pc-top .favb{width:40px;height:40px;background:#f2f2f2;border:1.5px solid #e10600;border-radius:50%}
.pc-top .favb.on{background:#e10600}

/* ===== characters ===== */
.chf{display:flex;gap:8px;overflow-x:auto;margin:12px 0 2px;padding:2px 0 6px;scrollbar-width:none}
.chf::-webkit-scrollbar{display:none}
.chf button{flex:none;padding:7px 16px;border-radius:999px;border:1.5px solid #e4e4e4;background:#fff;color:#4a414d;font-size:14px;cursor:pointer;white-space:nowrap}
.chf button.on{background:#e10600;border-color:#e10600;color:#fff}
.chh{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.chh h2{margin:0;font-size:20px;line-height:1.3}
.chh span{font-size:12px;padding:2px 10px;border-radius:99px;background:#f2f2f2;color:#555555}
.chg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:26px}

.rv-card{padding:16px 2px}
.rv-av{background:#111;color:#fff}

/* ===== round 2: filled nav, blended header, expandable review, comics + videos pages ===== */

/* review box: compact bar that expands */
.rvx{gap:0;padding:14px 16px}

/* comics page */
.sec>h1.ct{font-size:clamp(28px,7.5vw,38px);font-weight:700;margin:18px 0 14px;color:#111}

.sec .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;padding:4px 0 40px}

 #m{padding:0}

 .mb:not(.w){width:100%;max-width:560px;margin:0 auto;border-radius:30px 30px 0 0;border:0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}

}

/* ===== round 4: skeletons, page transitions, reviews, comics source filter, offline banner ===== */
@keyframes ptr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes ptl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes ptu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app[data-dir=r]>*{animation:ptr .38s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir=l]>*{animation:ptl .38s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir=u]>*{animation:ptu .34s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir]>.skw{animation:fadein .2s both}
.sk{background:linear-gradient(100deg,#eeeeee 35%,#f8f8f8 50%,#eeeeee 65%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
.skh{height:30px;margin:18px 0 14px}.skl{height:13px;margin:8px 0 0}
.skb{height:50px;border-radius:999px;margin:0 0 14px}.skp{height:40px;width:68%;border-radius:999px;margin:0 0 18px}
.skg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media(min-width:620px){.skg{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.skc-i{aspect-ratio:3/4;border-radius:20px}.skc-t{height:13px;margin:11px 3px 0;width:80%}.skc-t.s{width:48%;height:11px;margin-top:8px}
.skv-i{aspect-ratio:16/9;border-radius:24px}.skgv{display:grid;gap:24px}
.skhero{aspect-ratio:4/4.6;border-radius:28px;margin:0 0 24px}
@media(min-width:640px){.skhero{aspect-ratio:16/10}}
.skrow{height:64px;border-radius:20px;margin:0 0 12px}.skrc{height:150px;border-radius:26px}

/* offline banner */
#off{position:fixed;left:50%;top:10px;transform:translate(-50%,-90px);z-index:200;background:#111;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:92vw;text-align:center}
#off.on{transform:translate(-50%,0)}

#src{display:flex;margin:0 0 12px}#src button{flex:1;padding:10px 6px;font-size:14px;font-weight:600}
.orb.cr{background:rgba(255,255,255,.92);color:#111}

.rv-sum2{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:#f5f5f5;border-radius:26px;padding:18px;margin:0 0 16px}

.rv-card{border-bottom:1px solid #eee;padding:18px 2px}

function about(){
 $('#app').innerHTML=`<article class="sec art"><span class=kk>আকানো · Frangowst</span><h1>গল্প বলার ভাষা বদলে দিতে চাই আমরা</h1>
 <p class=lead>আকানো Frangowst-এর একটি উদ্যোগ। আমাদের লক্ষ্য একটাই: বিশ্বের সবচেয়ে বড় পপ কালচার প্রতিষ্ঠান হয়ে ওঠা।</p>
 <h2>স্বপ্নটা বড়, আর সেটাই আমাদের শক্তি</h2>
 <p>মার্ভেল কমিকসের কয়েকটি পাতা থেকে শুরু করে পুরো পৃথিবীর গল্প বলার ধরন বদলে দিয়েছে। আমরা বিশ্বাস করি, বাংলার মাটি থেকেও তেমন একটি জগৎ গড়ে ওঠা সম্ভব। তাই আমরা খোলাখুলি বলি, মার্ভেলের সঙ্গে পাল্লা দেওয়ার স্বপ্ন দেখতে আমরা ভয় পাই না।</p>
 <blockquote>আমরা শুধু গল্প বলতে চাই না, আমরা একটি জগৎ গড়তে চাই।</blockquote>
 <h2>আকানো মানে শুধু কমিকস নয়</h2>
 <p>শিল্প, সংস্কৃতি আর বিনোদন, এই তিন জায়গাতেই আমরা কাজ করতে চাই। কমিকস দিয়ে শুরু হলেও আমাদের যাত্রা সেখানে থেমে থাকবে না। চরিত্র, গল্প, ভিডিও আর ছবি মিলিয়ে ধীরে ধীরে একটি পূর্ণ জগৎ তৈরি হচ্ছে, যেখানে প্রতিটি চরিত্রের নিজস্ব ইতিহাস আছে।</p>
 <h2>কেন দেশি গল্প</h2>
 <p>আমাদের চারপাশে বলার মতো গল্পের অভাব নেই। অভাব ছিল সেই গল্পগুলোকে বিশ্বমানের চেহারা দেওয়ার। আমরা চাই বাংলাদেশের তরুণরা শুধু বিদেশি গল্পের পাঠক হয়ে না থেকে নতুন গল্পের স্রষ্টা হয়ে উঠুক। নিজেদের চরিত্র, নিজেদের নায়ক আর নিজেদের জগৎ নিয়ে গর্ব করার দিন আসছে।</p>
 <h2>আমরা এখন যা করছি</h2>
 <p>ওয়ানশট আর ধারাবাহিক সিরিজ কমিকস প্রকাশ করছি, যার কিছু সবার জন্য বিনামূল্যে, আর কিছু কোড দিয়ে পড়ার জন্য। আকানো জগতের চরিত্রদের পরিচয় তুলে ধরছি, আর ভিডিও ও ঘোষণার মাধ্যমে পাঠকদের সঙ্গে সংযোগ রাখছি।</p>
 <h2>এই যাত্রায় আপনিও আছেন</h2>
 <p>প্রতিটি পাঠক, প্রতিটি রিভিউ আর প্রতিটি শেয়ার আমাদের এগিয়ে যাওয়ার জ্বালানি। কমিকস পড়ুন, রিভিউ দিন, বন্ধুদের জানান, আর আমাদের ফেসবুক গ্রুপে যোগ দিন। পথটা লম্বা, কিন্তু আমরা হাঁটতে শুরু করেছি।</p>

// ---------- PWA: install করা যায় এমন অ্যাপ ----------
(()=>{
 const PROXY=true,OK=/^https?:\/\/(?:i\.)?ibb\.co\//i;
 const wOf=i=>i.closest('.vc.big,.pst-i,.nw')?900:i.closest('.th')?720:i.closest('.card,.ep,.cts,.lb-card,.chc')?420:600;
 const opt=i=>{if(i.dataset.fx)return;i.dataset.fx=1;
  if(i.closest('#v,.pages,.gv,#vp,header'))return;
  i.decoding='async';
  if(i.closest('.vc.big')&&!DS()){i.loading='eager';i.fetchPriority='high'}else if(!i.getAttribute('loading'))i.loading='lazy';
  const src=i.getAttribute('src')||'';
  if(PROXY&&OK.test(src)){i.dataset.o=src;i.onerror=()=>{i.onerror=null;i.src=i.dataset.o};i.src='https://images.weserv.nl/?url='+encodeURIComponent(src.replace(/^https?:\/\//,''))+'&w='+Math.round(wOf(i)*(DS()?.6:1))+'&q='+(DS()?50:72)+'&output=webp'}
  i.classList.add('fx');
  const done=()=>i.classList.add('ok');
  if(i.complete&&i.naturalWidth)done();else{i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true})}};
 const scan=n=>{if(n.nodeType!==1)return;if(n.tagName==='IMG')opt(n);else if(n.querySelectorAll)n.querySelectorAll('img').forEach(opt)};
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(scan))).observe(document.body,{childList:true,subtree:true});
 document.querySelectorAll('img').forEach(opt)})();
(()=>{const b=document.createElement('div');b.id='off';b.setAttribute('role','status');document.body.appendChild(b);
 const u=()=>{const off=navigator.onLine===false;b.textContent=language==='en'?'You are offline — showing saved content':'ইন্টারনেট নেই — সেভ করা তথ্য দেখানো হচ্ছে';b.classList.toggle('on',off)};
 addEventListener('online',u);addEventListener('offline',u);u();
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})})();

let KBX=null;
function kbIndex(){
 if(KBX)return KBX;
 const SYNMAP={};SYN.forEach((g,i)=>g.forEach(w=>{SYNMAP[aStem(aNorm(w))]='g'+i}));
 const toks=s=>aNorm(s).split(' ').filter(w=>w&&!STOPW.has(w)).map(w=>{const t=aStem(w);return SYNMAP[t]||t});
 const b=faqData('bn'),e=faqData('en');
 const docs=[...b.map(([c,q,a],i)=>({c,qb:q,ab:a,qe:e[i][1],ae:e[i][2],k:'',go:null})),...kbData()];
 docs.forEach(d=>{d.qt=new Set(toks(d.qb+' '+d.qe+' '+d.k));d.at=new Set(toks(d.ab+' '+d.ae));d.tri=aTri(aNorm(d.qb+' '+d.qe))});
 const df={};docs.forEach(d=>new Set([...d.qt,...d.at]).forEach(t=>df[t]=(df[t]||0)+1));
 return KBX={docs,toks,df,N:docs.length,SYNMAP}}
function kbScore(q){
 const X=kbIndex(),qt=new Set(X.toks(q)),nq=aNorm(q),tq=aTri(nq);
 return X.docs.map(d=>{let tot=0,hit=0;qt.forEach(t=>{const w=Math.log(1+X.N/(1+(X.df[t]||0)));tot+=w;if(d.qt.has(t))hit+=w;else if(d.at.has(t))hit+=w*.45});
  const cov=tot?hit/tot:0,sc=qt.size?(.75*cov+.25*aDice(tq,d.tri)):0;return{d,sc}}).sort((a,b)=>b.sc-a.sc)}
function entityMatch(q){
 const X=kbIndex(),nq=aNorm(q),qs=new Set(nq.split(' ').filter(Boolean).map(aStem)),tq=aTri(nq),out=[];
 const seen=lsRead('x')||null;
 const push=(kind,id,title,meta,go)=>{const nt=aNorm(title);if(!nt)return;const tt=nt.split(' ').filter(Boolean).map(aStem);let h=0;tt.forEach(t=>{if(qs.has(t))h++});const cov=tt.length?h/tt.length:0,dc=aDice(tq,aTri(nt)),sc=Math.max(cov*.9+(h?.1:0),dc*.85);if(sc>=.55&&(h>0||dc>=.6))out.push({kind,id,title,meta,go,sc})};
 (lsRead('comics')||[]).forEach(c=>c&&c.title&&push('comic',c.id,c.title,(c.free?T('ফ্রি','Free'):bn(c.price||0)+' '+T('টাকা','BDT'))+(c.orig?' · '+T('অরিজিনাল','Original'):''),'comics'));
 ((lsRead('videos')||{}).list||[]).forEach(v=>v&&v.title&&push('video',v.id,v.title,(+v.price>0?bn(v.price)+' '+T('টাকা','BDT'):T('ফ্রি','Free'))+' · '+owner(v),'videos'));
 const sn=seenIds();((lsRead('chars')||{}).list||[]).forEach(x=>{if(x&&x.name&&(!x.unlock||sn[x.unlock]))push('char',x.id,x.name,x.series||'','chars')});
 return out.sort((a,b)=>b.sc-a.sc).slice(0,3)}
const aEsc=esc;
function aLinks(go){if(!go||!go.length)return '';return '<div class=as-act>'+go.map(([r,b,e])=>r==='mail'?`<a class=as-a href="mailto:help.akano@gmail.com">${ic('mail')}${T(b,e)}</a>`:r==='fb'?`<a class=as-a href="${FBG}" target=_blank rel=noopener>${FBX}${T(b,e)}</a>`:`<button type=button class=as-a data-go="${r}">${T(b,e)}${ic('chev')}</button>`).join('')+'</div>'}
const aSay=()=>`<button type=button class=say data-say aria-label="${T('শুনুন','Listen')}">${ic('vol')}<span>${T('শুনুন','Listen')}</span></button>`;
const aAns=(text,go,extra)=>`<div data-sayt>${aEsc(text)}</div>${aLinks(go)}${extra||''}`;
function catCtx(){
 try{const en=language==='en',pr=(f,p)=>f||!(+p>0)?(en?'Free':'ফ্রি'):p+(en?' BDT':' টাকা');
  const c=(lsRead('comics')||[]).filter(x=>x&&x.title).map(x=>x.title+' ('+pr(x.free,x.price)+(x.orig?(en?', Original':', অরিজিনাল'):'')+')');
  const v=((lsRead('videos')||{}).list||[]).filter(x=>x&&x.title).map(x=>x.title+' ('+pr(0,x.price)+')');
  const h=((lsRead('chars')||{}).list||[]).filter(x=>x&&x.name).map(x=>x.name);
  return ('COMICS: '+(c.join('; ')||'-')+'\nVIDEOS: '+(v.join('; ')||'-')+'\nCHARACTERS: '+(h.join('; ')||'-')).slice(0,1800)}catch{return ''}}
async function aiAsk(q,ctx){
 if(!AI_ENDPOINT)return null;
 const dayK=new Date().toISOString().slice(0,10),st=LS.get('akAiN',{d:dayK,n:0});if(st.d!==dayK){st.d=dayK;st.n=0}
 const ck=aNorm(q),ac=LS.get('akAiC',{});if(ac[ck])return ac[ck];
 if(st.n>=10)return{limit:true};
 st.n++;LS.set('akAiN',st);
 const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q.slice(0,300),ctx:ctx.slice(0,3),cat:catCtx(),lang:language})});
 if(!r.ok)throw new Error('ai');const j=await r.json(),a=String(j.a||'').slice(0,900);
 if(a){ac[ck]=a;const ks=Object.keys(ac);if(ks.length>30)delete ac[ks[0]];LS.set('akAiC',ac)}return a}
async function wikiAnswer(q){
 const lang=language==='en'?'en':'bn',key='akWk:'+lang+':'+aNorm(q);
 try{const c=sessionStorage.getItem(key);if(c)return JSON.parse(c)}catch{}
 const u=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=extracts%7Cinfo&exintro=1&explaintext=1&exchars=450&inprop=url&format=json&origin=*`;
 const r=await fetch(u);if(!r.ok)throw new Error('wiki');const j=await r.json(),p=j.query&&Object.values(j.query.pages||{})[0];
 const out=p&&p.extract?{t:p.title,x:p.extract,u:p.fullurl}:null;try{sessionStorage.setItem(key,JSON.stringify(out))}catch{}return out}
async function asAnswer(q){
 const nq=aNorm(q);
 if(/^(hi|hello|hey|হাই|হ্যালো|সালাম|আসসালামু|নমস্কার)(\s|$)/.test(nq)&&nq.split(' ').length<=3)return aAns(T('হ্যালো! আমি আকানো সহকারী। কমিকস, ভিডিও, কোড, পেমেন্ট বা অ্যাপ নিয়ে জিজ্ঞেস করুন।','Hello! I am the Akano assistant. Ask me about comics, videos, codes, payments or the app.'));
 const X=kbIndex(),qt=new Set(X.toks(q));
 const cnt=/(কতগুলো|কয়টি|কয়টা|কত টি|how many|count|total)/.test(nq);
 if(cnt){const cm=(lsRead('comics')||[]).length,vd=((lsRead('videos')||{}).list||[]).length,ch=((lsRead('chars')||{}).list||[]).length,w=[];
  if(qt.has('g6')&&cm)w.push(T(`${bn(cm)}টি কমিকস`,`${cm} comics`));if(qt.has('g5')&&vd)w.push(T(`${bn(vd)}টি ভিডিও`,`${vd} videos`));if(qt.has('g7')&&ch)w.push(T(`${bn(ch)}টি ক্যারেক্টার`,`${ch} characters`));
  if(w.length)return aAns(T('এখন অ্যাপে আছে: ','Right now the app has: ')+w.join(', ')+'.')}
 if(!cnt&&/(কী কী|কি কি|কোন কোন|কোনগুলো|তালিকা|list|which|what)/.test(nq)&&!qt.has('g0')&&!qt.has('g18')){
  const en=language==='en',L=(a,n)=>a.length?(n+': '+a.slice(0,10).join(', ')+(a.length>10?(en?' and more':' ও আরও'):'')):'',w=[];
  if(qt.has('g6'))w.push(L((lsRead('comics')||[]).filter(x=>x&&x.title).map(x=>x.title),T('কমিকস','Comics')));
  if(qt.has('g5'))w.push(L(((lsRead('videos')||{}).list||[]).filter(x=>x&&x.title).map(x=>x.title),T('ভিডিও','Videos')));
  if(qt.has('g7'))w.push(L(((lsRead('chars')||{}).list||[]).filter(x=>x&&x.name).map(x=>x.name),T('ক্যারেক্টার','Characters')));
  const ww=w.filter(Boolean);if(ww.length)return aAns(ww.join(' | '),[[qt.has('g6')?'comics':qt.has('g5')?'videos':'chars','সবগুলো দেখুন','See all']])}
 const ent=entityMatch(q);
 const sc=kbScore(q),top=sc[0],best=top&&top.sc>=.42?top:null;
 if(ent.length&&(!best||ent[0].sc>=best.sc+.15)){
  const kindL={comic:T('কমিকস','Comic'),video:T('ভিডিও','Video'),char:T('ক্যারেক্টার','Character')};
  return `<div data-sayt>${aEsc(T('এগুলো পেয়েছি:','I found these:'))}</div><div class=as-cards>${ent.map(x=>`<button type=button class=as-card data-find="${aEsc(x.title)}" data-to="${x.go}"><span>${kindL[x.kind]}</span><b>${aEsc(x.title)}</b><small>${aEsc(x.meta)}</small></button>`).join('')}</div>`}
 if(best){
  const d=best.d,en=language==='en',more=sc.slice(1,3).filter(x=>x.sc>=.3&&x.d!==d);

   if(img){try{any192=fromLogo(img,192,.04);any512=fromLogo(img,512,.04);mask512=fromLogo(img,512,.2);touch=fromLogo(img,180,.04)}catch{}}
   if(!any512){any192=await letter(192);any512=await letter(512);mask512=any512;touch=await letter(180)}
  }
  const base=location.origin+location.pathname,scope=location.origin+location.pathname.replace(/[^/]*$/,'');
  const m={id:base,name:'Akano',short_name:'Akano',description:'Global comics, pop culture and entertainment — Frangowst',start_url:base,scope,display:'standalone',orientation:'any',background_color:'#ffffff',theme_color:'#e10600',lang:'en',
   icons:[{src:any192,sizes:'192x192',type:'image/png',purpose:'any'},{src:any512,sizes:'512x512',type:'image/png',purpose:'any'},{src:mask512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=touch;document.head.appendChild(ap);
 }catch{}
}
(()=>{
 if(!/^https?:$/.test(location.protocol))return;
 pwaManifest();
 window.addEventListener('beforeinstallprompt',()=>{try{renderNavigation()}catch{}});
 window.addEventListener('appinstalled',()=>{window.__pwa=null;try{renderNavigation()}catch{}});
 document.addEventListener('click',async e=>{const b=e.target.closest('#pwaI');if(!b)return;
  const p=window.__pwa;
  if(p){try{p.prompt();await p.userChoice}catch{}window.__pwa=null;try{renderNavigation()}catch{}return}
  alert(pwaIOS()?'Safari-র নিচের Share বাটনে চাপ দিয়ে “Add to Home Screen” বেছে নিন।':'ব্রাউজারের মেনু থেকে “Install app” বা “Add to Home screen” বেছে নিন।')});
 if(pwaStandalone())document.documentElement.classList.add('pwa');
})();
