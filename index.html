ধাপ ১ - Firebase Console:
  Authentication > Sign-in method > Email/Password চালু করুন।
  Firestore Database তৈরি করুন (production mode)।
ধাপ ২ - Firestore > Rules এ এটি বসান:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&exists(/databases/$(d)/documents/admins/$(request.auth.uid));}
 match /site/{x}{allow read:if true;allow write:if adm();}
 match /vsecure/{x}{allow get:if true;allow list,write:if adm();}
 match /comics/{x}{allow read:if true;allow create,delete:if adm();allow update:if adm()||(request.resource.data.diff(resource.data).affectedKeys().hasOnly(['views'])&&request.resource.data.views is int&&request.resource.data.views==resource.data.get('views',0)+1);}
 match /pages/{x}{allow read:if true;allow write:if adm();}
 match /gallery/{x}{allow read:if true;allow write:if adm();}
 match /news/{x}{allow read:if true;allow write:if adm();}
 match /orders/{x}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','method','lang','trx','comicId','comic','price','t'])&&request.resource.data.name is string&&request.resource.data.name.size()<200;allow read,update,delete:if adm();}
 match /codes/{c}{allow get:if true;allow list,create,delete:if adm();
  allow update:if adm()||(!('device' in resource.data)&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&request.resource.data.device is string&&request.resource.data.device.size()<80);}
 match /reviews/{x}{allow read:if resource.data.approved==true||adm();allow create:if request.resource.data.keys().hasOnly(['name','rating','text','comic','approved','t'])&&request.resource.data.approved==true&&request.resource.data.rating is int&&request.resource.data.rating>=1&&request.resource.data.rating<=5&&request.resource.data.name is string&&request.resource.data.name.size()>0&&request.resource.data.name.size()<=60&&request.resource.data.text is string&&request.resource.data.text.size()>0&&request.resource.data.text.size()<=500&&request.resource.data.comic is string&&request.resource.data.comic.size()<=120;allow update,delete:if adm();}
 match /videoViews/{x}{allow read:if true;allow create:if request.resource.data.keys().hasOnly(['n'])&&request.resource.data.n==1;allow update:if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['n'])&&request.resource.data.n==resource.data.n+1;allow delete:if adm();}
 match /comments/{x}{allow read:if true;allow create:if request.resource.data.keys().hasOnly(['l'])&&request.resource.data.l.size()==1&&request.resource.data.l[0].n is string&&request.resource.data.l[0].n.size()<=30&&request.resource.data.l[0].m is string&&request.resource.data.l[0].m.size()<=300;allow update:if request.resource.data.keys().hasOnly(['l'])&&request.resource.data.l.size()==resource.data.l.size()+1&&request.resource.data.l.size()<=300&&request.resource.data.l[request.resource.data.l.size()-1].n is string&&request.resource.data.l[request.resource.data.l.size()-1].n.size()<=30&&request.resource.data.l[request.resource.data.l.size()-1].m is string&&request.resource.data.l[request.resource.data.l.size()-1].m.size()<=300;allow write:if adm();}
 match /subapps/{r}{allow create:if request.resource.data.keys().hasOnly(['name','email','phone','whatsapp','cur','amount','method','trx','ref','status','t'])&&request.resource.data.status=='pending'&&request.resource.data.name is string&&request.resource.data.name.size()<100;allow read,update,delete:if adm();}
 match /coupons/{c}{allow get:if true;allow list,create,delete:if adm();allow update:if adm()||(request.resource.data.diff(resource.data).affectedKeys().hasOnly(['used'])&&request.resource.data.used is int&&request.resource.data.used==resource.data.get('used',0)+1&&resource.data.get('active',true)==true&&(resource.data.get('max',0)==0||request.resource.data.used<=resource.data.get('max',0)));}
 match /admins/{u}{allow get:if request.auth!=null&&request.auth.uid==u;allow list,write:if adm();}
}}
ধাপ ৩ - প্রথম অ্যাডমিন (একবারই):
  Authentication > Users > Add user: ইমেইল  ইউজারনেম@akano-admin.com  (যেমন ahmad@akano-admin.com) + পাসওয়ার্ড।
  ওই ইউজারের UID কপি করুন। Firestore > collection "admins" > Document ID = সেই UID,
  field: name (string, আপনার নাম), user (string, ইউজারনেম)।
  এরপর এই প্যানেল থেকেই আরও অ্যাডমিন যোগ করা যাবে।

/* comic purchase sheet */

.pc-ty{background:#f2f2f2;color:#555;font-weight:600}

/* series page */

/* ===== round 4: skeletons, page transitions, reviews, comics source filter, offline banner ===== */
@keyframes ptr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes ptl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes ptu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app[data-dir=r]>*{animation:ptr .38s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir=l]>*{animation:ptl .38s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir=u]>*{animation:ptu .34s cubic-bezier(.2,.8,.2,1) both}
#app[data-dir]>.skw{animation:fadein .2s both}
.sk{background:linear-gradient(100deg,#eeeeee 35%,#f8f8f8 50%,#eeeeee 65%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
.skh{height:30px;margin:18px 0 14px}.skl{height:13px;margin:8px 0 0}
.skb{height:50px;border-radius:999px;margin:0 0 14px}.skp{height:40px;width:68%;border-radius:999px;margin:0 0 18px}
.skg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media(min-width:620px){.skg{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.skc-i{aspect-ratio:3/4;border-radius:20px}.skc-t{height:13px;margin:11px 3px 0;width:80%}.skc-t.s{width:48%;height:11px;margin-top:8px}
.skv-i{aspect-ratio:16/9;border-radius:24px}.skgv{display:grid;gap:24px}
.skhero{aspect-ratio:4/4.6;border-radius:28px;margin:0 0 24px}
@media(min-width:640px){.skhero{aspect-ratio:16/10}}
.skrow{height:64px;border-radius:20px;margin:0 0 12px}.skrc{height:150px;border-radius:26px}

/* offline banner */
#off{position:fixed;left:50%;top:10px;transform:translate(-50%,-90px);z-index:200;background:#111;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:92vw;text-align:center}
#off.on{transform:translate(-50%,0)}

/* comics: source segmented control */
#src{display:flex;margin:0 0 12px}#src button{flex:1;padding:10px 6px;font-size:14px;font-weight:600}
.orb.cr{background:rgba(255,255,255,.92);color:#111}

/* reviews */
.rv-sum2{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:#f5f5f5;border-radius:26px;padding:18px;margin:0 0 16px}

.rv-big b{font-size:44px;line-height:1;font-weight:700;color:#111}
.rv-big small{font-size:12.5px;color:#777}
.rv-dist{display:grid;gap:6px}
.rv-dist button{display:grid;grid-template-columns:14px 1fr 26px;gap:8px;align-items:center;border:0;background:none;padding:2px 0;font-size:12px;color:#666;text-align:left}
.rv-dist button i{display:block;height:7px;border-radius:9px;background:#e4e4e4;overflow:hidden}
.rv-dist button u{display:block;height:100%;border-radius:9px;background:#111;text-decoration:none;transition:width .5s}
.rv-dist button.on u{background:#e10600}.rv-dist button.on span{color:#e10600;font-weight:700}
.rv-dist button em{font-style:normal;text-align:right}
.rv-tools{display:flex;margin:4px 0 8px}
.rv-sort{display:inline-flex;gap:4px;background:#f2f2f2;border-radius:999px;padding:4px}
.rv-sort button{border:0;background:none;padding:7px 16px;border-radius:999px;font-size:13.5px;color:#666}
.rv-sort button.on{background:#111;color:#fff}
.rv-card{border-bottom:1px solid #eee;padding:18px 2px}
.rv-for{display:inline-block;margin:10px 0 0;padding:4px 11px;border-radius:8px;background:#f2f2f2;font-size:12.5px;font-weight:600;color:#333}
.rv-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.rv-tags span{padding:4px 11px;border-radius:999px;border:1px solid #e2e2e2;font-size:12px;color:#555}
.rv-card p{margin:10px 0 0;line-height:1.75;color:#222}
.rv-more{display:block;width:100%;margin:16px 0 4px;padding:13px;border:0;border-radius:16px;background:#f2f2f2;color:#111;font-weight:600;font-size:14.5px}
.rvx-cnt{justify-self:end;margin-top:-6px;font-size:12px;color:#7d7d84}

/* ===== round 5: owner tag, settings logo, videos polish, flicker fix ===== */
#app[data-dir=x]>*{animation:none}

.st-card img{width:auto!important;height:52px!important;max-width:130px;border-radius:12px!important;padding:0!important;background:none!important;object-fit:contain}

/* owner tag colour follows the meta text (white on the hero card) */

/* English wordmark = Roboto (the YouTube font), no exclamation mark */

.st-card .akwm{display:block;position:static;font-size:19px;line-height:1.25;color:#111}

/* ===== round 6: header language toggle, hidden scrollbars, better player, FAQ ===== */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}

header #lgb{margin-right:auto}

/* player */
#vp .vct{gap:8px;border-radius:22px 22px 0 0}
#vp #vtm{font-size:12px;white-space:nowrap;opacity:.9}
#vp input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,#e10600 var(--p,0%),rgba(255,255,255,.3) var(--p,0%));cursor:pointer}
#vp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.18)}
#vp input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
#vp .vsp{min-width:44px;font-size:13px;font-weight:700;border-radius:999px;background:rgba(255,255,255,.14)}
#vp .vspin{position:absolute;z-index:3;width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:vspn .8s linear infinite;pointer-events:none}
#vp .vspin[hidden]{display:none}
@keyframes vspn{to{transform:rotate(360deg)}}
#vp .vfb{position:absolute;z-index:3;top:50%;transform:translateY(-50%);padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.6);font-weight:700;opacity:0;pointer-events:none}
#vp .vfb.l{left:12%}#vp .vfb.r{right:12%}
#vp .vfb.go{animation:vfb .65s ease}
@keyframes vfb{0%{opacity:0;transform:translateY(-50%) scale(.8)}20%{opacity:1;transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#vp .vnx{position:absolute;z-index:4;right:16px;bottom:16px;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;max-width:min(80%,330px);padding:12px 14px 12px 16px;border-radius:18px;background:#fff;color:#111;text-align:left;box-shadow:0 18px 40px -14px rgba(0,0,0,.7)}
#vp .vnx[hidden]{display:none}
#vp .vnx small{grid-column:1;color:#777;font-size:12px}
#vp .vnx b{grid-column:1;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#vp .vnx span{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:50%;background:#e10600;display:grid;place-items:center}
#vp .vnx span .ic{width:20px;height:20px;color:#fff}

/* FAQ */
.faqp{max-width:720px}
.faqp .chp{margin-bottom:16px}
.faqp .fq{width:100%;margin:0 0 10px;background:#f6f6f6;border:0;border-radius:20px;padding:0 16px;transition:background .2s,box-shadow .2s}

.faqp .fq summary i{flex:none;width:28px;height:28px;border-radius:50%;background:#111;color:#fff;font-style:normal;font-size:12.5px;font-weight:600;display:grid;place-items:center}
.faqp .fq summary span{flex:1}
.faqp .fq summary::after{content:'';flex:none;width:9px;height:9px;margin:0 4px 3px 0;border-right:2px solid #111;border-bottom:2px solid #111;transform:rotate(45deg);transition:transform .25s}
.faqp .fq[open] summary::after{content:'';transform:rotate(-135deg);margin-bottom:-3px}
.faqp .fq p{margin:0;padding:0 0 18px 40px;line-height:1.85;color:#444;animation:fqd .3s ease}
@keyframes fqd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fq[hidden]{display:none}
.fqk{margin:22px 0 50px;padding:22px;border-radius:26px;background:linear-gradient(120deg,#0e0e10,#2a2a2e);color:#fff}

.fqk div{display:flex;flex-wrap:wrap;gap:10px}
.fqk a{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.fqk a .ic,.fqk a svg{width:18px;height:18px}

/* ===== round 7: toggle icon, home posts ===== */
body header #langToggle{gap:7px}
#langToggle .ic{width:18px;height:18px}

.pst p{margin:12px 2px 0;line-height:1.75;color:#222;white-space:pre-line}
.pst-l{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:10px 18px;border-radius:999px;background:#111;color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.pst-l .ic{width:16px;height:16px}
body header #langToggle{width:42px;min-width:42px;padding:0;gap:0}
#langToggle .ic{width:22px;height:22px}
img.fx{transition:opacity .35s ease}img.fx:not(.ok){opacity:0}

/* ===== round 8: ad gate overlay + desktop layout ===== */
html.adg-on{overflow:hidden}
.adg{position:fixed;inset:0;z-index:500;background:#000;color:#fff;display:flex;flex-direction:column}

.as-dots i{background:#c9b9b7}
.as-chip{background:#f1ebea}

.favb{border:0!important;box-shadow:none!important}

/* forms: centered sheet (like the reference) */
html.fmbg body{background:#ececef}
html.fmbg .pw{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:14px 0 24px!important;max-width:none}
html.fmbg .pw .pw-pg{width:100%;max-width:460px;padding:0 6px}
html.fmbg .pw-card{position:relative;border:0!important;border-radius:36px!important;padding:26px 20px 20px!important;box-shadow:0 24px 60px -34px rgba(0,0,0,.35)!important}
html.fmbg .pw-card::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:#cfcfd4;margin:-14px auto 14px}
html.fmbg .pw-top{position:absolute;top:34px;right:30px;z-index:3;margin:0!important}
html.fmbg .pw-top .pw-ic{width:36px;height:36px;background:#f1f1f3}
html.fmbg .pw-h2{text-align:center;font-size:19px!important;margin:6px 44px 4px!important}
html.fmbg .pw-s2{text-align:center;font-size:13px!important;margin:0 6px 16px!important}
html.fmbg .pw-card>.pw-chs{background:#f1f1f3;border-radius:999px;padding:4px;width:fit-content;margin:4px auto 16px;gap:2px}
html.fmbg .pw-card>.pw-chs .pw-ch{flex:none;border:0!important;background:transparent!important;padding:9px 18px;font-size:13px;color:#777!important}
html.fmbg .pw-card>.pw-chs .pw-ch.on{background:#fff!important;color:#111!important;box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
html.fmbg .pw-form input:not([type=radio]):not([type=checkbox]),html.fmbg .pw-form textarea{width:100%;box-sizing:border-box;border:0;background:#f7f7f8;border-radius:14px;padding:13px 14px;font-size:14.5px;font-family:inherit;color:#111;outline:0;margin:0 0 8px}
html.fmbg .pw-l{margin:14px 2px 6px!important;font-size:13px;color:#8a8a92}
html.fmbg .pw-tls{display:flex!important;flex-wrap:wrap;gap:8px}
html.fmbg .pw-tl span{border:0!important;border-radius:999px;background:#f4f4f5;padding:9px 14px!important;display:flex;align-items:center;gap:7px}
html.fmbg .pw-tl b{font-size:13px;color:#666}
html.fmbg .pw-tl input:checked+span{border:0!important;padding:9px 14px!important;background:#e9e9ec;box-shadow:inset 0 0 0 1.5px #111}
html.fmbg .pw-tl input:checked+span b{color:#111}
/* upgrade sheet: centered, centered text */
.pw-dk{background:#ececef!important;justify-content:center}
.pw-dm:empty{display:none}
@media(max-width:699px){.pw-dm{flex:0 0 auto!important;min-height:0!important;padding:64px 24px 8px!important}.pw-dm img{max-height:34vh!important}
 .pw-sh{flex:0 0 auto!important;width:calc(100% - 24px)!important;max-width:460px!important;margin:12px auto!important;border-radius:32px!important;background:#fff!important;border:0!important;box-shadow:0 24px 60px -30px rgba(0,0,0,.3)!important}}
.pw-sh{text-align:center}
.pw-pc{text-align:left}
@media(min-width:700px){.pw-sh{margin:auto!important}}
/* compact buttons + same look for Plus upgrade */
html.fmbg .pw-form .pw-sub{display:block!important;width:auto!important;min-width:170px;margin:12px auto 0!important;padding:12px 30px!important;font-size:15px!important;border-radius:999px!important;background:#111!important}
.pw-go2{display:block!important;width:auto!important;min-width:170px;margin:10px auto 0!important;padding:12px 30px!important;font-size:15px!important}
.pw-bn{width:auto!important;min-width:170px;margin:8px auto 0!important;padding:11px 26px!important;font-size:14px!important;display:block}
.pw-sh::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:#cfcfd4;margin:0 auto 14px}

.qst-cd input{flex:1;min-width:0;border:2px solid #e5e5e5;border-radius:14px;background:#f7f7f7;padding:0 14px;font-size:15px}
.qst-cd .qst-ap{margin-top:0;width:auto;flex:none;padding:12px 16px;font-size:14px}
.qst-er{margin:8px 2px 0;color:#d33;font-size:13px;min-height:0}.qst-er:empty{display:none}
.qst-ok{margin-top:12px;padding:14px;border-radius:16px;background:#e5e5e5;color:#777;text-align:center;font-weight:700}.qst-ok.off{color:#afafaf}
.qst-ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.qst-b h2{margin-top:0}
.qst-b p a{color:#111;text-decoration:underline;word-break:break-all}
.qst-top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}.qst-top h1{margin:0}
.qst-bk{flex:none;width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid #e5e5e5;border-bottom:4px solid #d6d6d6;display:flex;align-items:center;justify-content:center;color:#111;padding:0;cursor:pointer}
.qst-tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px}
.qst-tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#fff;border:2px solid #e5e5e5;font-weight:700;font-size:14px;color:#555;cursor:pointer}
.qst-tab.on{background:#111;border-color:#111;color:#fff}
.qst-tab small{font-size:11px;font-weight:700;background:#f0f0f0;color:#888;border-radius:999px;padding:2px 7px}
.qst-d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qst-d.open{display:block;-webkit-line-clamp:unset}
.qst-mo{display:inline-block;margin-top:6px;background:none;border:0;padding:0;color:#111;font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer}
.qst-sl{display:flex;align-items:center;gap:10px;margin-top:14px;padding:8px 8px 8px 14px;border-radius:14px;background:#f5f6f8}
.qst-su{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#666;font-size:13px}
.qst-sb{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:#fff;border:2px solid #e5e5e5;border-bottom-width:4px;font-weight:700;font-size:13.5px;color:#111;cursor:pointer}
.nw.qst.hl{box-shadow:0 0 0 3px #111}
.qin{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:13px 14px;border:2px solid #e5e5e5;border-radius:14px;background:#f7f7f7;font-size:15px}
.qbtn{display:block;width:100%;margin-top:10px;padding:14px 16px;border-radius:16px;background:#fff;color:#1f1f1f;border:2px solid #e5e5e5;border-bottom:5px solid #d6d6d6;box-shadow:none;font-weight:700;font-size:15.5px;line-height:1.2;cursor:pointer;transition:transform .08s,border-bottom-width .08s}
.qbtn:active{transform:translateY(3px);border-bottom-width:2px}

.soon,.soon.emp{font-weight:600!important;color:#555!important}
.qst-rl{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f5f6f8;font-size:14px}

.qst-rl[hidden]{display:none}
.st-c{width:44px!important;height:44px!important;border-radius:14px!important;background:#fff!important;border:2px solid #e5e5e5!important;border-bottom:4px solid #d6d6d6!important;color:#111!important;box-shadow:none!important}

  'কীভাবে কমিকস কিনব?':'How do I buy a comic?','কমিকসের কার্ডে ট্যাপ করুন। অর্ডার ফর্মে নাম, ইমেইল, ফোন, হোয়াটসঅ্যাপ নম্বর, পেমেন্টের মাধ্যম ও (পেমেন্টের পর) ট্রানজেকশন আইডি দিয়ে অর্ডার পাঠান।':'Tap a comic card. Enter your name, email, phone, WhatsApp number, payment method, and transaction ID in the order form, then submit it.','কীভাবে টাকা পাঠাব?':'How do I pay?','ফর্মে যে মাধ্যমে (বিকাশ, নগদ, রকেট বা অন্যান্য) টাকা পাঠাতে চান সেটি বেছে নিন। সেই মাধ্যম অনুযায়ী আমরা যোগাযোগ করে পেমেন্টের নম্বর জানাব।':'Choose a payment method in the form (bKash, Nagad, Rocket, or another option). We will contact you with the payment number.','কোড কীভাবে ও কখন পাব?':'How and when will I receive my code?','পেমেন্ট যাচাইয়ের পর আপনার ইমেইল বা হোয়াটসঅ্যাপে কোড পাঠানো হয়।':'After payment is verified, your code will be sent by email or WhatsApp.','কোড কীভাবে ব্যবহার করব?':'How do I use my code?','কোডের মেয়াদ কত দিন?':'How long is the code valid?','একটি কোড কয়টি ডিভাইসে চলে?':'How many devices can use one code?','ফ্রি কমিকস পড়তে কি কোড লাগে?':'Do free comics need a code?','ওয়ানশট আর সিরিজ কী?':'What is the difference between a one-shot and a series?','পড়া কি মনে থাকে?':'Is my reading progress saved?','স্ক্রিনশট বা শেয়ার করা যাবে?':'Can I take screenshots or share a comic?','সমস্যা হলে কোথায় জানাব?':'Where can I report a problem?','এখনো কোনো রিভিউ নেই। প্রথম রিভিউ আপনিই দিন!':'No reviews yet. Be the first to leave one!','কমিকস বা ক্যারেক্টারের বুকমার্ক আইকনে ট্যাপ করলে এখানে যোগ হবে (এই ডিভাইসে)।':'Tap the bookmark on a comic or character to add it to My List (saved on this device).','কোড দিয়ে কেনা কমিকস এখানে মেয়াদ অনুযায়ী (২০ দিন) জমা থাকবে (এই ডিভাইসে)।':'Comics purchased with a code are saved here for 20 days on this device.','কোনো ঘোষণা নেই':'No announcements','পড় কমিকস':'Read comics','ফেসবুক গ্রুপে যোগ দিন':'Join the Facebook group','আপনার ইমেইল':'Your email','আমি যে মাধ্যমে টাকা পাঠাতে চাই':'Choose a payment method','কোডের জন্য অর্ডার পাঠান':'Submit order for a code let KBX=null;
function kbIndex(){
 if(KBX)return KBX;
 const SYNMAP={};SYN.forEach((g,i)=>g.forEach(w=>{SYNMAP[aStem(aNorm(w))]='g'+i}));
 const sk=t=>{const bnw=/[\u0980-\u09FF]/.test(t);if(SYNMAP[t]||t.length<(bnw?3:4))return '';const k=aSkel(t);return k.length>=3||(k.length===2&&t.length>=5)?'~'+k:''};
 const toks=s=>{const o=[];aNorm(s).split(' ').forEach(w=>{if(!w||STOPW.has(w))return;const t=aStem(w),g=SYNMAP[t];o.push(g||t);const k=g?'':sk(t);if(k)o.push(k)});return o};
 const b=faqData('bn'),e=faqData('en');
 const docs=[...b.map(([c,q,a],i)=>({c,qb:q,ab:a,qe:e[i][1],ae:e[i][2],k:'',go:null})),...kbData()];
 docs.forEach(d=>{d.qt=new Set(toks(d.qb+' '+d.qe+' '+d.k));d.at=new Set(toks(d.ab+' '+d.ae));d.tri=aTri(aNorm(d.qb+' '+d.qe))});
 const df={};docs.forEach(d=>new Set([...d.qt,...d.at]).forEach(t=>df[t]=(df[t]||0)+1));
 const vocab=Object.keys(df).filter(x=>x[0]!=='~'&&!/^g\d+$/.test(x)&&x.length>=3),syk=Object.keys(SYNMAP);
 const fuzz=t=>{const mx=t.length>=7?2:1;let best=null,bd=9,bw=0;const tw=(w,res,wt)=>{if(Math.abs(w.length-t.length)>mx)return;const d=aLev(t,w,mx);if(d<=mx&&(d<bd||(d===bd&&wt>bw))){bd=d;best=res;bw=wt}};syk.forEach(w=>tw(w,{g:SYNMAP[w]},5));vocab.forEach(w=>tw(w,{t:w},df[w]||0));return best};
 const words=q=>{const m=new Map();aNorm(q).split(' ').forEach(w=>{if(!w||STOPW.has(w))return;let t=aStem(w),g=SYNMAP[t],k='';if(!g){k=sk(t);if(!df[t]&&t.length>=4){const f=fuzz(t);if(f){if(f.g)g=f.g;else t=f.t}}}const key=g||t;if(!m.has(key))m.set(key,{t:key,k:g?'':k})});return[...m.values()]};
 return KBX={docs,toks,df,N:docs.length,SYNMAP,words}}
function kbScore(q){
 const X=kbIndex(),W=X.words(q),nq=aNorm(q),tq=aTri(nq),wt=x=>Math.log(1+X.N/(1+(X.df[x]||0)));
 return X.docs.map(d=>{const dw=d.qw||(d.qw=[...d.qt].reduce((a,x)=>a+wt(x),0));let tot=0,hit=0,hq=0;W.forEach(({t,k})=>{const kn=/^g\d+$/.test(t)||X.df[t]||(k&&X.df[k]),w=(kn?1:.5)*Math.max(wt(t),k?wt(k)*.9:0);tot+=w;let h=0,qq=0;[[t,1],[k,.9]].forEach(([x,f])=>{if(!x)return;if(d.qt.has(x)){h=Math.max(h,wt(x)*f);qq=Math.max(qq,wt(x))}else if(d.at.has(x))h=Math.max(h,wt(x)*f*.45)});hit+=Math.min(h,w);hq+=qq});
  const cov=tot?hit/tot:0,pr=dw?Math.sqrt(Math.min(1,hq/dw)):0,sc=W.length?(.65*cov+.2*pr+.15*aDice(tq,d.tri)):0;return{d,sc}}).sort((a,b)=>b.sc-a.sc)}

const aNoLeak=t=>String(t==null?'':t).replace(/(?:https?:\/\/)?(?:[\w-]+\.)*(?:vimeo\.com|vimeocdn\.com)(?:\/[^\s<>"')]*)?/gi,'').replace(/\bplayer\.vimeo[^\s<>"')]*/gi,'');

function catCtx(){
 try{const en=language==='en',pr=(f,p)=>f||!(+p>0)?(en?'Free':'ফ্রি'):p+(en?' BDT':' টাকা');
  const c=(lsRead('comics')||[]).filter(x=>x&&x.title).map(x=>x.title+' ('+pr(x.free,x.price)+(x.orig?(en?', Original':', অরিজিনাল'):'')+')');
  const v=((lsRead('videos')||{}).list||[]).filter(x=>x&&x.title).map(x=>x.title+' ('+pr(0,x.price)+')');
  
  return ('COMICS: '+(c.join('; ')||'-')+'\nVIDEOS: '+(v.join('; ')||'-')).slice(0,1800)}catch{return ''}}
async function aiAsk(q,ctx){
 if(!AI_ENDPOINT)return null;
 const dayK=new Date().toISOString().slice(0,10),st=LS.get('akAiN',{d:dayK,n:0});if(st.d!==dayK){st.d=dayK;st.n=0}
 const ck=aNorm(q),ac=LS.get('akAiC',{});if(ac[ck])return ac[ck];
 if(st.n>=10)return{limit:true};
 st.n++;LS.set('akAiN',st);
 const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q.slice(0,300),ctx:ctx.slice(0,3),cat:catCtx(),lang:language})});
 if(!r.ok)throw new Error('ai');const j=await r.json(),a=String(j.a||'').slice(0,900);
 if(a){ac[ck]=a;const ks=Object.keys(ac);if(ks.length>30)delete ac[ks[0]];LS.set('akAiC',ac)}return a}
async function wikiAnswer(q){
 const key='akWk3:'+language+':'+aNorm(q);
 try{const c=sessionStorage.getItem(key);if(c&&c!=='null')return JSON.parse(c)}catch{}
 const toks=aNorm(q).split(' ').filter(w=>w.length>=3&&!STOPW.has(w)).map(aStem);
 const cut=t=>{let x=String(t||'').trim();if(x.length>=430){const k=Math.max(x.lastIndexOf('।'),x.lastIndexOf('. '));if(k>150)x=x.slice(0,k+1)}return x};
 const okTxt=(title,ex)=>{if(!ex)return false;if(/may refer to|disambiguation|বোঝাতে পারে|নির্দেশ করতে পারে/i.test(String(ex).slice(0,200)))return false;if(toks.length&&!toks.some(t=>aNorm(title+' '+ex).includes(t)))return false;return true};
 let out=null;
 for(const lang of(language==='en'?['en']:['bn','en'])){
  try{const u=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=450&format=json&origin=*`;
   const r=await tmo(fetch(u),9000);if(r.ok){const j=await r.json(),ps=Object.values((j.query&&j.query.pages)||{}).sort((x,y)=>(x.index||9)-(y.index||9));
    for(const p of ps){if(okTxt(p.title,p.extract)){out={x:cut(p.extract)};break}}}}catch{}
  if(out)break;
  try{const o=await tmo(fetch(`https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=3&namespace=0&format=json&origin=*`),9000);
   const j=o.ok?await o.json():[],ts=j[1]||[];
   for(const ti of ts){const r=await tmo(fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(ti)}`),9000);if(!r.ok)continue;const p=await r.json();if(p.type==='disambiguation')continue;if(okTxt(ti,p.extract)){out={x:cut(p.extract)};break}}}catch{}
  if(out)break}
 if(out){try{sessionStorage.setItem(key,JSON.stringify(out))}catch{}}
 return out}

function mParse(src,vars){
 const s=src;let i=0;

 const eat=c=>{ws();if(s[i]===c){i++;return true}return false};
 function expr(){let v=term();for(;;){ws();if(s[i]==='+'){i++;v=mAdd(v,term())}else if(s[i]==='-'){i++;v=mSub(v,term())}else return v}}

 function postfix(){let v=primary();for(;;){ws();if(s[i]==='!'){i++;v=mFact(v)}else if(s[i]==='%'){i++;v=mDiv(v,mInt(100))}else return v}}

  if(s[i]==='('){i++;const v=expr();if(!eat(')'))throw'paren';return v}
  const rest=s.slice(i),m=/^\d+(?:\.\d+)?|^\.\d+/.exec(rest);
  if(m){i+=m[0].length;return mNum(m[0])}
  const w=/^[a-z]+/.exec(rest);

   if(id==='pi')return{f:Math.PI};if(id==='e')return{f:Math.E};
   if(vars&&Object.prototype.hasOwnProperty.call(vars,id))return vars[id];

  const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=touch;document.head.appendChild(ap);
 }catch{}
}
(()=>{
 if(!/^https?:$/.test(location.protocol))return;
 pwaManifest();
 window.addEventListener('beforeinstallprompt',()=>{try{renderNavigation()}catch{}});
 window.addEventListener('appinstalled',()=>{window.__pwa=null;try{localStorage.akPwaInst='1'}catch{}try{renderNavigation()}catch{}});document.addEventListener('click',e=>{if(e.target.closest('#pwaO'))window.open(location.origin+location.pathname,'_blank');const sb=e.target.closest('.sbt');if(sb){const bx=sb.parentElement.querySelector(':scope>.sb');if(bx){bx.classList.toggle('open');if(bx.classList.contains('open')){const i=bx.querySelector('input');if(i)i.focus()}}}});
 document.addEventListener('click',async e=>{const b=e.target.closest('#pwaI');if(!b)return;
  const p=window.__pwa;
  if(p){try{p.prompt();await p.userChoice}catch{}window.__pwa=null;try{renderNavigation()}catch{}return}
  alert(pwaIOS()?'Safari-র নিচের Share বাটনে চাপ দিয়ে “Add to Home Screen” বেছে নিন।':'ব্রাউজারের মেনু থেকে “Install app” বা “Add to Home screen” বেছে নিন।')});
 if(pwaStandalone())document.documentElement.classList.add('pwa');

/* ===== নতুন APK আপডেটের নোটিফিকেশন (অ্যাডমিন প্যানেল → সেটিংস → অ্যাপ আপডেট) ===== */
(()=>{
 const KEY='akUpdSeen';
 const css=document.createElement('style');
 css.textContent='.upd-o{position:fixed;inset:0;z-index:900;background:#0008;backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px}@media(min-width:700px){.upd-o{align-items:center}}.upd-b{background:#fff;color:#111;width:100%;max-width:420px;border-radius:24px;padding:24px;box-shadow:0 25px 70px #0006;animation:updin .35s cubic-bezier(.2,.8,.2,1) both}.upd-i{width:54px;height:54px;border-radius:16px;background:#e10600;color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:12px}.upd-b h3{margin:0 0 4px;font-size:21px}.upd-v{display:inline-block;background:#f2f2f2;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;margin:2px 0 10px}.upd-b p{margin:0 0 18px;color:#444;line-height:1.6;white-space:pre-line}.upd-a{display:flex;gap:10px;flex-wrap:wrap}.upd-a a,.upd-a button{flex:1;min-width:130px;text-align:center;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}.upd-a a{background:#e10600;color:#fff;border:0}.upd-a button{background:#f2f2f2;color:#111;border:0}@keyframes updin{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}';
 document.head.appendChild(css);
 const show=u=>{
  if(document.getElementById('upd'))return;
  const o=document.createElement('div');o.id='upd';o.className='upd-o';
  o.innerHTML=`<div class=upd-b role=dialog aria-modal=true><div class=upd-i>⬇</div><h3>${esc(u.title||T('নতুন আপডেট এসেছে','A new update is available'))}</h3>${u.v?`<span class=upd-v>${T('ভার্সন','Version')} ${esc(u.v)}</span>`:''}<p>${esc(u.msg||T('অ্যাপের নতুন ভার্সন ডাউনলোডের জন্য প্রস্তুত। ডাউনলোড করে ইনস্টল করুন।','The new version of the app is ready. Download and install it.'))}</p><div class=upd-a><a href="${esc(u.url)}" target=_blank rel="noopener noreferrer" id=updgo>${T('ডাউনলোড করুন','Download')}</a><button type=button id=updlt>${T('পরে','Later')}</button></div></div>`;
  document.body.appendChild(o);
  const later=()=>{try{sessionStorage.akUpdLater=String(u.t)}catch{}o.remove()};
  const got=()=>{try{localStorage[KEY]=String(u.t)}catch{}o.remove()};
  o.querySelector('#updlt').onclick=later;
  o.querySelector('#updgo').addEventListener('click',()=>setTimeout(got,300));
  o.addEventListener('click',e=>{if(e.target===o)later()});
 };
 const run=async()=>{
  try{
   const u=await cache('update',()=>dat('site','update').then(x=>x||{on:0}),6e5);
   if(!u||!u.on||!/^https:\/\//i.test(u.url||''))return;
   let seen='';try{seen=localStorage[KEY]||''}catch{}
   if(seen===String(u.t))return;
   let lt='';try{lt=sessionStorage.akUpdLater||''}catch{}
   if(lt===String(u.t))return;
   show(u);
  }catch{}
 };
 setTimeout(run,2500);
})();

/* ===== ভিডিও কার্ডের ছোট প্রিভিউ: স্ক্রল থামলে সামনের ভিডিওটি চলবে (সময় অ্যাডমিন থেকে ঠিক করা), ভিউ গোনা হবে না ===== */
(()=>{
 const IDLE=500;let cur=null,curTh=null,curC=null,tm=null,st=null,doneEl=null,PVS=10;
 (async()=>{try{const c=await cache('pvcfg',async()=>(await dat('site','preview'))||{},6e5);if(c&&c.s!=null&&!isNaN(+c.s))PVS=Math.max(0,+c.s)}catch{}})();
 const secFor=c=>{const p=+c.dataset.ps;return p>0?p:PVS};
 const kbOff=th=>{const im=th&&th.querySelector('img');if(im){im.classList.remove('kbz');im.style.animationDuration=''}};
 const kbOn=(th,s)=>{const im=th&&th.querySelector('img');if(im){im.classList.remove('kbz');im.style.animationDuration=s+'s';void im.offsetWidth;im.classList.add('kbz')}};
 const kill=f=>{if(!f)return;try{f.style.opacity=0}catch{}try{f._p&&f._p.destroy()}catch{}setTimeout(()=>{try{f.remove()}catch{}},350)};
 const stop=()=>{clearTimeout(st);if(cur){kill(cur);cur=null}if(curTh){kbOff(curTh);curTh=null}if(curC){curC.classList.remove('pvon');curC=null}};
 const blocked=()=>{try{if(document.hidden)return true;if(navigator.onLine===false)return true;if(typeof DS==='function'&&DS())return true;if(navigator.connection&&navigator.connection.saveData)return true;const vp=document.getElementById('vp');if(vp&&vp.classList.contains('on'))return true;if(document.getElementById('upd')||document.getElementById('adf'))return true;if(document.documentElement.classList.contains('nonav'))return true}catch{}return false};
 const pick=()=>{const vh=innerHeight,vw=innerWidth;let b=null,bd=1e9;
  document.querySelectorAll('.vc[data-pv]').forEach(c=>{if(secFor(c)<=0)return;const th=c.querySelector('.th');if(!th)return;const r=th.getBoundingClientRect();if(!r.width||!r.height)return;
   const ih=Math.min(r.bottom,vh)-Math.max(r.top,0),iw=Math.min(r.right,vw)-Math.max(r.left,0);if(ih<r.height*.7||iw<r.width*.7)return;
   const d=Math.abs((r.top+r.bottom)/2-vh*.5)+Math.abs((r.left+r.right)/2-vw*.5)*.6;if(d<bd){bd=d;b=th}});
  return b};
 const play=th=>{const c=th.closest('.vc');if(!c||th===doneEl)return;const sec=secFor(c);if(sec<=0)return;stop();doneEl=th;curTh=th;
  let ds=false;try{ds=typeof DS==='function'&&DS()}catch{}
  const fin=()=>stop();
  if(ds||navigator.onLine===false||(navigator.connection&&navigator.connection.saveData)){curTh=null;return}kbOn(th,sec);
  const f=document.createElement('iframe');f.className='vpv';f.tabIndex=-1;f.setAttribute('aria-hidden','true');f.setAttribute('allow','autoplay; encrypted-media');f.title='';
  f.src='https://player.vimeo.com/video/'+encodeURIComponent(c.dataset.pv)+'?'+(c.dataset.ph?'h='+encodeURIComponent(c.dataset.ph)+'&':'')+'autoplay=1&muted=1&loop=1&controls=0&title=0&byline=0&portrait=0&badge=0&dnt=1&playsinline=1&autopause=0';
  const img=th.querySelector('img');th.insertBefore(f,img?img.nextSibling:th.firstChild);cur=f;
  /* ফ্রেম সত্যিই চালু হলে: টাইটেল/ভিউ/শেয়ার সব মুছে শুধু ভিডিও দেখায়, আর নির্ধারিত সেকেন্ড গোনা শুরু হয় */
  (typeof loadVimeo==='function'?loadVimeo():Promise.reject()).then(()=>{if(cur!==f||!window.Vimeo)return;const p=new Vimeo.Player(f);f._p=p;
    p.on('timeupdate',d=>{if(cur===f&&d&&d.seconds>0.05&&!f._ok){f._ok=1;f.style.opacity=1;c.classList.add('pvon');curC=c;clearTimeout(st);st=setTimeout(fin,sec*1000)}});
    p.setVolume(0).catch(()=>{}).then(()=>{if(cur===f)return p.play()}).catch(()=>{})}).catch(()=>{});
  st=setTimeout(fin,(sec+6)*1000)};
 const sched=()=>{clearTimeout(tm);tm=setTimeout(()=>{if(blocked())return;const th=pick();if(th)play(th)},IDLE)};
 addEventListener('scroll',()=>{stop();doneEl=null;sched()},{passive:true,capture:true});
 addEventListener('resize',()=>{stop();doneEl=null;sched()});
 addEventListener('hashchange',()=>{stop();doneEl=null;sched()});
 document.addEventListener('visibilitychange',()=>{stop();doneEl=null;if(!document.hidden)sched()});
 document.addEventListener('click',()=>stop(),true);
 const app=document.getElementById('app');if(app)new MutationObserver(()=>sched()).observe(app,{childList:true,subtree:true});
 setTimeout(sched,1500);
})();

try{const blk=e=>{const el=e.target;if(el&&el.closest&&el.closest('img,video,picture,canvas,.th,.cv,svg'))e.preventDefault()};addEventListener('contextmenu',blk,true);addEventListener('dragstart',blk,true);document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('img').forEach(i=>i.draggable=false));new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.tagName==='IMG')n.draggable=false;n.querySelectorAll&&n.querySelectorAll('img').forEach(i=>i.draggable=false)}}))).observe(document.documentElement,{childList:true,subtree:true})}catch{}


try{let aif=0;const aip=()=>{aif=0;const on=!!document.querySelector('.aiw');document.documentElement.classList.toggle('ai-on',on);const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',on?'#cf2f35':'#f5f6f8')};new MutationObserver(()=>{if(!aif)aif=requestAnimationFrame(aip)}).observe(document.body,{childList:true,subtree:true});aip()}catch{}

/* comic reader: hide pages when app loses focus / on PrintScreen / print shortcuts (best effort — browsers cannot truly block screenshots) */
try{const rdOn=()=>{const r=document.getElementById('v');return !!(r&&r.classList.contains('on'))},hide=()=>{if(rdOn())document.body.classList.add('rd-hide')},show=()=>document.body.classList.remove('rd-hide');
document.addEventListener('visibilitychange',()=>document.hidden?hide():setTimeout(show,150));
addEventListener('blur',hide);addEventListener('pagehide',hide);addEventListener('focus',()=>setTimeout(show,150));addEventListener('pageshow',()=>setTimeout(show,150));
addEventListener('keyup',e=>{if(e.key==='PrintScreen'&&rdOn()){try{navigator.clipboard.writeText(' ')}catch{}hide();setTimeout(show,1200)}});
addEventListener('keydown',e=>{if(!rdOn())return;const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==='p'||k==='s'||k==='u')||(e.ctrlKey&&e.shiftKey&&(k==='s'||k==='i'))||e.key==='F12'){e.preventDefault();hide();setTimeout(show,800)}},true);
addEventListener('beforeprint',hide);addEventListener('afterprint',show);
document.addEventListener('copy',e=>{if(rdOn())e.preventDefault()},true)}catch{}
